<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.jfsteps{margin:6px 0 0;padding-left:20px;display:grid;gap:8px}.jfsteps .chip{vertical-align:middle}.jfnote{margin-top:4px;white-space:pre-wrap;color:var(--muted);font-size:.92em}
</style></head><body>
<title>Manpower HRIS</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed navy sidebar (brand + grouped nav) beside a warm off-white workspace of white cards, matching the Head Office Dashboard reference. */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f2f0ea; --ink:#121a2c; --muted:#596175; --line:#e4e1d9;
  --side:#0f1e3f; --side-ink:#eef1f8; --side-muted:#a3aec8; --side-line:#223360; --side-hover:#182a52; --side-active:#1d3163;
  --gold:#f3c623; --btn:#0f1e3f; --btn-ink:#ffffff; --btn-hover:#1b2f5c;
  --bar:#3b6ea8; --bar-track:#efede7;
  --ok:#1b6e45; --ok-bg:#e1f2e8; --warn:#8a5300; --warn-bg:#fcefd6; --bad:#ac2a20; --bad-bg:#fae4e1; --info:#28589c; --info-bg:#e4ecf8; --neutral:#4d5568; --neutral-bg:#ecebe5;
  --focus:#2f6fd6; --scrim:rgba(9,15,32,.52);
  --shadow:0 1px 2px rgba(15,30,63,.05),0 6px 18px rgba(15,30,63,.05);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#131b2e; --surface-2:#1a2339; --ink:#e8ecf5; --muted:#a0a9bd; --line:#27324c;
  --side:#08102a; --side-ink:#e8ecf5; --side-muted:#95a1bd; --side-line:#1b284a; --side-hover:#122044; --side-active:#182a57;
  --gold:#f3c623; --btn:#f3c623; --btn-ink:#0f1e3f; --btn-hover:#f7d65a;
  --bar:#6c9bd6; --bar-track:#1f2941;
  --ok:#72d6a0; --ok-bg:#133526; --warn:#f3c26b; --warn-bg:#382a0f; --bad:#ff9186; --bad-bg:#3b1a18; --info:#90b6f0; --info-bg:#172a49; --neutral:#b4bccd; --neutral-bg:#212b43;
  --focus:#90b6f0; --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#131b2e; --surface-2:#1a2339; --ink:#e8ecf5; --muted:#a0a9bd; --line:#27324c;
  --side:#08102a; --side-ink:#e8ecf5; --side-muted:#95a1bd; --side-line:#1b284a; --side-hover:#122044; --side-active:#182a57;
  --gold:#f3c623; --btn:#f3c623; --btn-ink:#0f1e3f; --btn-hover:#f7d65a;
  --bar:#6c9bd6; --bar-track:#1f2941;
  --ok:#72d6a0; --ok-bg:#133526; --warn:#f3c26b; --warn-bg:#382a0f; --bad:#ff9186; --bad-bg:#3b1a18; --info:#90b6f0; --info-bg:#172a49; --neutral:#b4bccd; --neutral-bg:#212b43;
  --focus:#90b6f0; --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--btn);color:var(--btn-ink);padding:10px 14px;border-radius:10px;font-weight:700}
.skip:focus{top:12px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100%}
.app.side-off{grid-template-columns:0 minmax(0,1fr)}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:40}
.app.side-off .side{visibility:hidden}
.brand{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:2px solid color-mix(in srgb,var(--gold) 55%,transparent)}
.logo{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px rgba(243,198,35,.25)}
.logo svg{width:30px;height:30px}
.b1{font-weight:800;font-size:18px;letter-spacing:.01em}
.b2{font-weight:700;font-size:13px;color:var(--gold);letter-spacing:.05em}
.nav{padding:14px 12px 20px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav a,.grp{display:flex;align-items:center;gap:14px;min-height:46px;padding:0 14px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-size:16.5px;font-weight:500;background:none;border:0;width:100%;text-align:left}
.nav a svg{color:var(--side-muted)}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-active);font-weight:700}
.nav a[aria-current="page"] svg{color:var(--gold)}
.nav a .cnt{margin-left:auto;background:var(--gold);color:#0f1e3f;font-size:12px;font-weight:800;min-width:24px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 7px}
.grp{margin-top:14px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);min-height:40px}
.grp:hover{color:var(--side-ink)}
.grp .gb{margin-left:auto;background:var(--side-line);color:var(--side-ink);font-size:11.5px;min-width:22px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;letter-spacing:0}
.grp .chev{transition:transform .2s}
.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.side-foot{padding:14px 20px 20px;border-top:1px solid var(--side-line);font-size:13px;color:var(--side-muted);display:flex;gap:10px;align-items:flex-start}
.side-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted);margin-top:6px;flex:none}
.side-foot .dot.live{background:#4fd18b}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 24px;min-height:70px}
.icon-btn{width:44px;height:44px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.top h1{font-size:21px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch{position:relative;width:min(400px,40vw)}
.gsearch input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 70px 0 44px;font-size:15px}
.gsearch>svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.gsearch kbd{position:absolute;right:10px;top:11px;font:600 11.5px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--muted);background:var(--surface-2)}
.gres{position:absolute;top:52px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(10,20,45,.16);padding:6px;z-index:50}
.gres button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:10px;border-radius:8px}
.gres button:hover,.gres button:focus-visible{background:var(--surface-2)}
.me-wrap{position:relative;flex:none}button.avatar{cursor:pointer;padding:0}
.me-menu{position:absolute;top:52px;right:0;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(10,20,45,.16);padding:6px;z-index:60}
.me-menu .who{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.me-menu .who b{display:block}.me-menu .who span{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.me-menu button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;color:var(--ink);font-size:15px}
.me-menu button:hover,.me-menu button:focus-visible{background:var(--surface-2)}
.gres .none{padding:12px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--side);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;overflow:hidden;border:2px solid var(--surface)}
.avatar img{width:100%;height:100%;object-fit:cover}
.scrim{display:none}

#view{padding:28px 30px 60px;outline:none;display:flex;flex-direction:column;gap:22px;max-width:1520px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h2{font-size:30px;font-weight:800}
.ph p{margin:4px 0 0;color:var(--muted);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 28px;min-width:0}
.card>h3{font-size:19px;font-weight:600;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:19px;font-weight:600}
.link{background:none;border:0;color:var(--info);font-weight:600;padding:6px 4px;font-size:14.5px;display:inline-flex;gap:6px;align-items:center}
.link:hover{text-decoration:underline}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 20px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:148px;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--bar) 45%,var(--line))}
.tile b{font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;color:var(--muted);font-size:16px;line-height:1.35}
.tile span svg{color:var(--muted);width:18px;height:18px}
.tile.alert b{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:15.5px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn.bad-ghost{background:var(--surface);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.bad-ghost:hover{background:var(--bad-bg)}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:8px}
.btn svg{width:18px;height:18px}
.qa{display:flex;gap:12px;flex-wrap:wrap}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:700}
.row .meta{color:var(--muted);font-size:14.5px}
.row .dt{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14.5px}
button.row{background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;border-radius:0}
button.row:hover .nm{text-decoration:underline}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* bars */
.bars{display:grid;grid-template-columns:minmax(110px,190px) 1fr 36px;gap:12px 16px;align-items:center}
.bars .bl{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.bars .bt{height:24px;background:var(--bar-track);border-radius:6px;overflow:hidden}
.bars .bf{height:100%;background:var(--bar);border-radius:6px}
.bars .bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.chip svg{width:14px;height:14px;stroke-width:2.4}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.sample{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}

/* toolbar + tabs */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.toolbar .srch{position:relative;flex:1 1 240px;max-width:380px}
.toolbar .srch svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.toolbar .srch input{padding-left:42px}
.toolbar select{flex:0 1 200px}
.att-tb .srch{flex:1 1 150px;min-width:0}
@media (min-width:901px){.att-tb{flex-wrap:nowrap}.att-tb>input,.att-tb>select{min-width:0}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center;min-height:46px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--btn)}
.tabs .n{background:var(--surface-2);border-radius:10px;padding:0 8px;font-size:12.5px;font-variant-numeric:tabular-nums;line-height:20px}

/* tables */
.tw{overflow-x:auto;margin:0 -8px}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:760px}
.tbl th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .nm{font-weight:700}
.tbl .sub{color:var(--muted);font-size:13.5px}
.tbl .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tbl td.r,.tbl th.r{text-align:right}
.ms{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.ms .d{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px}
.prog .t{width:80px;height:8px;border-radius:4px;background:var(--bar-track);overflow:hidden}
.prog .f{height:100%;background:var(--bar)}
.prog .f.full{background:var(--ok)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14.5px}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--info-bg);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:14.5px}
.banner svg{color:var(--info)}
.banner .grow{flex:1;min-width:200px}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 24px 60px rgba(5,12,30,.35);width:min(640px,calc(100vw - 32px));max-height:min(90vh,900px)}
dialog.wide{width:min(900px,calc(100vw - 32px))}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.mform{display:flex;flex-direction:column;max-height:inherit}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px 24px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:20px;font-weight:700}
.mbody{padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mfoot .left{margin-right:auto}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 16px 18px;margin:0;min-width:0}
legend{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0 6px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:14px}
.field label .req{color:var(--bad)}
.field .help{color:var(--muted);font-size:13px;margin:0}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 12px;font-size:15.5px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
[aria-invalid="true"]{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:13.5px;margin:0;font-weight:600}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px}
.ck{display:flex;gap:10px;align-items:center;min-height:40px;font-size:15px;cursor:pointer}
.ck input{width:20px;height:20px;min-height:0;accent-color:var(--bar);flex:none}
.summary{background:var(--surface-2);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.summary dt{color:var(--muted)} .summary dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.formerr{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600}

/* drawer */
#drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(600px,100vw);border-radius:0;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.dwrap{display:flex;flex-direction:column;height:100%}
.dhead{padding:20px 20px 0 24px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.dtop{display:flex;gap:14px;align-items:flex-start}
.dtop .avatar{width:56px;height:56px;font-size:19px}
.dtop h2{font-size:22px;font-weight:800}
.dtop p{margin:2px 0 0;color:var(--muted)}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dacts{display:flex;gap:8px;flex-wrap:wrap}
.dbody{padding:20px 24px 40px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.kv div{min-width:0}
.kv dt{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kv dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.sect h4{margin:0 0 10px;font-size:15px;font-weight:700}
.tl{display:flex;flex-direction:column}

/* ---- Permit to Work: return-to-work clearance after a leave ---- */
function nextWorkday(d){let x=addDays(d,1);if(parse(x).getDay()===0)x=addDays(x,1);return x}
function ptwNo(date){const d=parse(date||today());const y=d.getFullYear();const re=new RegExp('^PTW'+y+'-\\d{2}-(\\d{4})$');let max=0;S.permits.forEach(x=>{const r=re.exec(x.no||'');if(r)max=Math.max(max,+r[1])});return`PTW${y}-${pad(d.getMonth()+1)}-${String(max+1).padStart(4,'0')}`}
const leaveOf=p=>S.leaves.find(l=>l.id===p.leaveId);
function permitFor(l){return S.permits.filter(p=>p.leaveId===l.id).sort((a,b)=>(b.filedAt||'')<(a.filedAt||'')?-1:1)[0]}
function ptwChip(l){if(l.status!=='Approved')return'';const p=permitFor(l);
  if(!p)return`<span class="chip warn" title="The employee must secure a Permit to Work before returning">${ic('hat')}No permit yet</span>`;
  if(p.status==='Pending')return`<span class="chip info">${ic('clock')}Permit pending</span>`;
  if(p.status==='Approved')return`<span class="chip ok">${ic('check')}Permit ${esc(p.no)}</span>`;
  return`<span class="chip bad">Permit declined</span>`}
const ptwLeaveText=p=>`${esc(p.leaveType||'—')} leave · ${fmt(p.leaveFrom)} – ${fmt(p.leaveTo)}${p.leaveDays?` · ${p.leaveDays} day${p.leaveDays===1?'':'s'}`:''}`;
const needsFit=p=>p.leaveType==='Sick'&&!(p.attachments||[]).length;

/* ---- Leave Summary Report: approved leaves in a period and whether each one has a Permit to Work ---- */
const LREP_TABS=['All','Permit issued','Permit pending','Permit declined','No permit filed','Not yet back'];
function lrepStatus(l){const p=permitFor(l);const back=nextWorkday(l.to);
  if(!p)return{k:diff(back,today())>=0?'No permit filed':'Not yet back',p,back};
  const filed=p.filedAt?iso(new Date(p.filedAt)):'';

/* ---------------- modal system ---------------- */
const MD=$('#modal');
function field(o){
  const id=o.id,req=o.req?' required':'',lab=`<label for="${id}">${o.label}${o.req?' <span class="req" aria-hidden="true">*</span>':''}</label>`;
  let ctl;const v=o.value==null?'':o.value;
  if(o.type==='select'){ctl=`<select id="${id}" name="${o.name}"${req} ${o.attrs||''}>${o.html||((o.blank!==false?`<option value="">${o.blank||'Select'}</option>`:'')+o.opts.map(x=>{const[val,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`}).join(''))}</select>`}
  else if(o.type==='textarea')ctl=`<textarea id="${id}" name="${o.name}"${req} ${o.attrs||''}>${esc(v)}</textarea>`;
  else ctl=`<input id="${id}" name="${o.name}" type="${o.type||'text'}" value="${esc(v)}"${req} ${o.attrs||''}>`;
  return`<div class="field ${o.full?'full':''}">${lab}${ctl}${o.help?`<p class="help">${o.help}</p>`:''}</div>`;
}
function openModal({title,body,foot,wide,onSubmit,onOpen,submitLabel='Save',submitClass=''}){
  MD.className=wide?'wide':'';
  MD.innerHTML=`<form class="mform" novalidate><header class="mhead"><h2 id="mtitle">${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ic('x')}</button></header><div class="mbody">${body}</div><footer class="mfoot">${foot||`<button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn ${submitClass}">${submitLabel}</button>`}</footer></form>`;
  MD.setAttribute('aria-labelledby','mtitle');
  const f=MD.querySelector('form');
  f.addEventListener('submit',async ev=>{
    ev.preventDefault();if(!onSubmit)return MD.close();
    if(!validate(f))return;
    const btns=f.querySelectorAll('button[type=submit]');btns.forEach(b=>b.disabled=true);
    try{const r=await onSubmit(new FormData(f),f,ev.submitter);if(r!==false)MD.close()}
    catch(e){console.error(e);if(!f.querySelector('.formerr'))f.querySelector('.mbody').insertAdjacentHTML('afterbegin','<div class="formerr" role="alert">This was not saved. Check your connection and try again.</div>')}
    finally{btns.forEach(b=>b.disabled=false)}
  });
  f.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>MD.close()));
  if(!MD.open)MD.showModal();
  onOpen&&onOpen(f);
  const first=f.querySelector('.mbody input,.mbody select,.mbody textarea');if(first)first.focus();
}
function whenReady(col,id,fn,n=0){if(S[col].some(x=>x.id===id))return fn();if(n<30)setTimeout(()=>whenReady(col,id,fn,n+1),100)}
function validate(f){
  f.querySelectorAll('.ferr,.formerr').forEach(e=>e.remove());f.querySelectorAll('[aria-invalid]').forEach(e=>{e.removeAttribute('aria-invalid');e.removeAttribute('aria-describedby')});
  let first=null;
  f.querySelectorAll('[required]').forEach(el=>{if(!String(el.value).trim()){const l=f.querySelector(`label[for="${el.id}"]`);setErr(el,`${l?l.textContent.replace('*','').trim():'This field'} is required.`);first=first||el}});
  if(first){first.focus();return false}return true;
}
function setErr(el,msg){el.setAttribute('aria-invalid','true');const p=document.createElement('p');p.className='ferr';p.id=el.id+'-err';p.textContent=msg;el.setAttribute('aria-describedby',p.id);(el.closest('.field')||el.parentNode).append(p);el.focus()}
function confirmBox(title,msg,label,fn){openModal({title,body:`<p style="margin:0">${msg}</p>`,submitLabel:label,submitClass:'bad',onSubmit:fn})}

/* ---------------- toasts ---------------- */
function toast(msg,o={}){
  const t=document.createElement('div');t.className='toast '+(o.kind||'');const s=document.createElement('span');s.textContent=msg;t.append(s);
  if(o.undo){const b=document.createElement('button');b.className='toast-btn';b.textContent='Undo';b.onclick=async()=>{t.remove();try{await o.undo();toast('Change undone.')}catch(e){}};t.append(b)}
  $('#toasts').append(t);setTimeout(()=>t.remove(),o.undo?7000:4000);
}

function applyStatus(fd,f,p,o,prev){
  const st=String(fd.get('status')||'Active');const g=k=>String(fd.get(k)||'').trim();
  if(st==='Separated'&&g('separationReason')==='Other'&&!g('separationDetails')){setErr(f.querySelector('#'+p+'-sx'),'Describe the reason for separation.');return false}
  o.status=st;
  if(st==='Separated')Object.assign(o,{separationReason:g('separationReason'),separationDate:g('separationDate'),lastWorkingDay:g('lastWorkingDay'),separationDetails:g('separationDetails'),rehireEligible:g('rehireEligible')});
  if(st==='Blocklisted')Object.assign(o,{blocklistReason:g('blocklistReason'),blocklistDate:g('blocklistDate'),blocklistDetails:g('blocklistDetails'),rehireEligible:'No'});
  const before=prev?empStatus(prev):null;
  const reason=st==='Separated'?o.separationReason:st==='Blocklisted'?o.blocklistReason:'';
  const prevReason=prev?(before==='Separated'?sepReason(prev):before==='Blocklisted'?prev.blocklistReason:''):'';
  if(before!==st||reason!==prevReason)o.statusHistory=(o.statusHistory||[]).concat([{status:st,reason,details:st==='Separated'?o.separationDetails:st==='Blocklisted'?o.blocklistDetails:'',date:st==='Separated'?o.separationDate:st==='Blocklisted'?o.blocklistDate:today(),at:new Date().toISOString(),by:MEID}]);

}

    <ul class="docs">${DOCS.map(([k,l])=>{const have=docFiles(e,k).length;return`<li class="doc" data-sk="${k}"><div class="doc-h"><label class="ck"><input type="checkbox" name="doc_${k}" ${docHas(e,k)?'checked':''}>${esc(l)}${DOC_COND[k]?` <span style="font-weight:400;color:var(--muted)">(${k==='marriage'?'if married':'if with dependents'})</span>`:''}</label>${have?`<span class="chip ok">${ic('pclip')}${have} on file</span>`:''}${ASSETS?`<button type="button" class="btn sm ghost" data-stage="${k}" aria-label="Attach ${esc(l)}">${ic('upload')}Attach</button><input type="file" data-stagein="${k}" accept="${ACCEPT}" multiple hidden>`:''}</div><div class="files staged" id="ef-st-${k}"></div></li>`}).join('')}</ul>

      f.querySelector('#ef-calcm').onclick=()=>{const d=parseFloat(f.dailySalary.value);if(!(d>0)){setErr(f.dailySalary,'Enter the daily salary first.');return}f.monthlySalary.value=(Math.round(d*26*100)/100).toFixed(2)};
      const draw=k=>{const box=f.querySelector('#ef-st-'+k);if(!box)return;const fl=staged[k]||[];
        box.innerHTML=fl.map((x,i)=>`<div class="file"><span class="fic" style="color:var(--info)">${ic(/^image\//.test(fileType(x)||'')?'pclip':'pdf')}</span><div class="fn"><b style="overflow-wrap:anywhere;font-weight:600">${esc(x.name)}</b><span>${fsize(x.size)} · uploads when you save</span></div><button type="button" class="icon-btn" data-unstage="${k}|${i}" aria-label="Remove ${esc(x.name)}">${ic('x')}</button></div>`).join('');
        const cb=f.querySelector(`[name="doc_${k}"]`);if(cb&&fl.length)cb.checked=true};
      const solo=f.querySelector('#ef-solo');solo.addEventListener('change',()=>{f.querySelector('#ef-solo-more').hidden=!solo.checked});
      const pwd=f.querySelector('#ef-pwd');pwd.addEventListener('change',()=>{f.querySelector('#ef-pwd-more').hidden=!pwd.checked});
      const single=k=>k==='__bank'||k==='__solo'||k==='__pwd';
      const add=(k,files)=>{const bad=[];staged[k]=single(k)?[]:(staged[k]||[]);
        for(const x of files){const t=fileType(x);if(!t)bad.push(`${x.name}: use PDF, JPG or PNG`);else if(x.size>20*1048576)bad.push(`${x.name}: larger than 20 MB`);else{staged[k].push(x);if(single(k))break}}
        draw(k);if(bad.length)toast(bad.join(' · '),{kind:'bad'})};
      f.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{const i=f.querySelector(`[data-stagein="${b.dataset.stage}"]`);if(i)i.click()}));
      f.querySelectorAll('[data-stagein]').forEach(i=>i.addEventListener('change',()=>{const fl=[...i.files];i.value='';if(fl.length)add(i.dataset.stagein,fl)}));
      f.addEventListener('click',ev=>{const u=ev.target.closest('[data-unstage]');if(!u)return;const[k,i]=u.dataset.unstage.split('|');staged[k].splice(+i,1);draw(k)});
      if(ASSETS)f.querySelectorAll('li.doc[data-sk]').forEach(li=>{li.addEventListener('dragover',ev=>{ev.preventDefault();li.classList.add('drop')});li.addEventListener('dragleave',()=>li.classList.remove('drop'));li.addEventListener('drop',ev=>{ev.preventDefault();li.classList.remove('drop');const fl=[...(ev.dataTransfer&&ev.dataTransfer.files||[])];if(fl.length)add(li.dataset.sk,fl)})});
    },
    onSubmit:async(fd,f)=>{
      const dup=S.employees.find(x=>String(x.empNo||'').trim().toLowerCase()===String(fd.get('empNo')).trim().toLowerCase()&&x.id!==id);
      if(dup){setErr(f.querySelector('#ef-empNo'),`Employee no. is already used by ${fullName(dup)}.`);return false}
      if(fd.get('status')==='Separated'&&fd.get('separationReason')==='Other'&&!String(fd.get('separationDetails')||'').trim()){setErr(f.querySelector('#es-sx'),'Describe the reason for separation.');return false}
      const bl=blocklistMatch(fd.get('firstName'),fd.get('lastName'),fd.get('birthDate'),id);
      if(bl&&f.dataset.blok!==bl.id){f.dataset.blok=bl.id;f.querySelector('.mbody').insertAdjacentHTML('afterbegin',`<div class="formerr" role="alert">${ic('alert')} <b>Blocklisted match:</b> ${esc(fullName(bl))} (${esc(bl.empNo)}) was blocklisted${bl.blocklistDate?' on '+fmt(bl.blocklistDate):''} for <b>${esc(bl.blocklistReason||'an unrecorded reason')}</b>${bl.blocklistDetails?`: ${esc(bl.blocklistDetails)}`:''}. Check that this is a different person. To save anyway, click <b>${id?'Save changes':'Add employee'}</b> again.</div>`);f.querySelector('.mbody').scrollTop=0;return false}
      const prevBank=(id&&EMP[id]&&EMP[id].bank)||{};
      const acct=String(fd.get('bankAccountNo')||'').replace(/[\s-]/g,'');
      if(acct&&!/^\d{10,16}$/.test(acct)){setErr(f.querySelector('#ef-bankAccountNo'),'Enter the AUB account number using digits only (10 to 16 digits).');return false}
      const newProof=(staged.__bank||[]).length>0;
      if(acct&&!newProof&&!(prevBank.proof||[]).length){const b=f.querySelector('#ef-bankproof')||f.querySelector('#ef-bankAccountNo');setErr(b,'Attach a photo of the account number so HR can cross-check it.');return false}
      const isSolo=!!fd.get('soloParent');if(!isSolo)delete staged.__solo;
      const isPwd=!!fd.get('pwd');if(!isPwd)delete staged.__pwd;
      const prevPwd=(id&&EMP[id]&&EMP[id].pwdProof)||[];
      if(isPwd&&!String(fd.get('pwdId')||'').trim()){setErr(f.querySelector('#ef-pwdId'),'Enter the PWD ID number.');return false}
      if(isPwd&&ASSETS&&!(staged.__pwd||[]).length&&!prevPwd.length){setErr(f.querySelector('#ef-pwdproof'),'Attach a copy of the PWD ID.');return false}
      const sb=f.querySelector('button[type=submit]');const total=Object.values(staged).reduce((s,a)=>s+a.length,0);
      const ups={},errs=[];
      if(total&&ASSETS){let n=0;for(const k of Object.keys(staged)){ups[k]=[];for(const x of staged[k]){n++;sb.textContent=`Uploading ${n} of ${total}…`;
        try{const r=await ASSETS.upload(x,{type:fileType(x)});ups[k].push({id:r.id,name:x.name.slice(0,140),type:r.contentType,size:r.sizeBytes,at:new Date().toISOString(),by:MEID})}catch(err){errs.push(`${x.name}: ${upErr(err)}`)}}}
        sb.textContent='Saving…'}
      if(acct&&newProof&&!(ups.__bank||[]).length&&!(prevBank.proof||[]).length){sb.textContent=id?'Save changes':'Add employee';setErr(f.querySelector('#ef-bankproof'),'The account photo did not upload: '+errs.join(' · '));return false}
      const o=id?clone(EMP[id]):{id:uid(),evals:{},...(pre&&pre.applicantId?{applicantId:pre.applicantId}:{})};
      ['firstName','middleName','lastName','suffix','gender','birthDate','civilStatus','mobile','email','client','empNo','position','department','site','supervisorName','supervisorEmail','shiftStart','shiftEnd','birthPlace','nationality','religion','dependents','education','school','course','biometricId','probContractNo','regContractNo','companyOrientation','clientOrientation','clientMrNo','endorsementNo','dailySalary','monthlySalary','allowance','allowanceNote','medicalDate','medicalClinic','medicalResult','hdmfTracking','employmentType','status','hireDate','regularizedOn','sss','philhealth','pagibig','tin','emergencyName','emergencyRelation','emergencyPhone'].forEach(k=>o[k]=String(fd.get(k)||'').trim());
      {const A=f._addr,pa=A.PA.get(),pm=A.same.checked?pa:A.PM.get();o.addr=pa;o.permAddr=pm;o.address=addrLine(pa);o.permanentAddress=addrLine(pm)}
      if(o.employmentType==='Regular'&&!o.regularizedOn&&EMP[id]&&EMP[id].employmentType==='Probationary')o.regularizedOn=today();
      if(!applyStatus(fd,f,'es',o,id?EMP[id]:null)){sb.textContent=id?'Save changes':'Add employee';return false}
      o.docs={};DOCS.forEach(([k])=>{if(fd.get('doc_'+k))o.docs[k]=true});
      o.files=o.files||{};DOCS.forEach(([k])=>{if((ups[k]||[]).length){o.files[k]=(o.files[k]||[]).concat(ups[k]);o.docs[k]=true}});
      const prevSolo=(id&&EMP[id]&&EMP[id].soloProof)||[];
      o.soloParent=isSolo;
      if(isSolo){o.soloParentId=String(fd.get('soloParentId')||'').trim();o.soloParentValidUntil=String(fd.get('soloParentValidUntil')||'');o.soloChildren=String(fd.get('soloChildren')||'').trim();if((ups.__solo||[]).length)o.soloProof=ups.__solo;}
      o.pwd=isPwd;
      if(isPwd){o.pwdType=String(fd.get('pwdType')||'');o.pwdId=String(fd.get('pwdId')||'').trim();o.pwdValidUntil=String(fd.get('pwdValidUntil')||'');if((ups.__pwd||[]).length)o.pwdProof=ups.__pwd;}
      const replaced=((ups.__bank||[]).length?(prevBank.proof||[]):[]).concat((ups.__solo||[]).length?prevSolo:[]).concat((ups.__pwd||[]).length?prevPwd:[]);
      const proof=(ups.__bank||[]).length?ups.__bank:(prevBank.proof||[]);
      const same=acct===prevBank.accountNo&&!(ups.__bank||[]).length;
      if(acct||proof.length)o.bank={bank:BANK,accountName:String(fd.get('bankAccountName')||'').trim(),accountNo:acct,proof,verified:same?!!prevBank.verified:false,mismatch:same?!!prevBank.mismatch:false,verifiedAt:same?prevBank.verifiedAt||'':'',verifiedBy:same?prevBank.verifiedBy||null:null,checkNote:same?prevBank.checkNote||'':''};
      else delete o.bank;
      await save('employees',o);
      for(const x of replaced){try{await ASSETS.delete(x.id)}catch(err){}}
      const up=Object.values(ups).reduce((s,a)=>s+a.length,0);
      toast(`${id?'201 file updated':fullName(o)+' added'}${up?` · ${up} file${up===1?'':'s'} uploaded`:''}.`);
      if(errs.length)toast('Not uploaded: '+errs.join(' · '),{kind:'bad'});
      if(!id&&pre&&pre.applicantId)await markHired(pre.applicantId,o.id);
      if(!id)whenReady('employees',o.id,()=>openEmp(o.id,'docs'));
    }});
}
function crossCheck(id){
  const e=EMP[id];const b=(e&&e.bank)||{};const p=(b.proof||[])[0];if(!b.accountNo)return;
  openModal({title:'Cross-check AUB Account',wide:1,
    body:`<p class="help" style="margin:0;color:var(--muted)">Compare the number typed in the 201 file with the number in the photo, digit by digit.</p>
    <div class="acctcheck"><div><div class="flabel">Typed in 201 file</div><div class="acct num">${esc(acctFmt(b.accountNo))}</div><div class="help" style="color:var(--muted)">${esc(BANK)} · ${esc(b.accountName||fullName(e))}</div></div>
    <div>${p?(/^image\//.test(p.type)?`<img class="proofimg" src="/_blob/${esc(p.id)}" alt="Photo of the account number submitted by ${esc(fullName(e))}">`:`<div class="empty" style="border:1px dashed var(--line);border-radius:12px">${ic('pdf')}<strong>PDF proof</strong><a class="btn sm ghost" href="/_blob/${esc(p.id)}" target="_blank" rel="noopener">${ic('ext')}Open in new tab</a></div>`):'<div class="empty">No photo on file.</div>'}</div></div>
    ${field({id:'cc-note',name:'note',label:'Remarks',type:'textarea',value:b.checkNote||'',attrs:'style="min-height:70px"',help:'Required if the numbers do not match. Example: last digit in photo is 7, typed as 1.'})}`,
    foot:`<button type="button" class="btn ghost left" data-close>Cancel</button><button type="submit" class="btn bad-ghost" value="bad">Does not match</button><button type="submit" class="btn ok" value="ok">${ic('check')}Matches · mark verified</button>`,
    onSubmit:async(fd,f,sub)=>{
      const ok=!sub||sub.value==='ok';const note=String(fd.get('note')||'').trim();
      if(!ok&&!note){setErr(f.querySelector('#cc-note'),'Describe what does not match so the employee can correct it.');return false}
      const o=clone(EMP[id]);o.bank={...o.bank,verified:ok,mismatch:!ok,checkNote:note,verifiedAt:new Date().toISOString(),verifiedBy:MEID};
      await save('employees',o);toast(ok?'AUB account marked as verified.':'AUB account flagged as not matching.');
    }});
}
function delEmp(id){
  const e=EMP[id];const n=S.leaves.filter(x=>x.employeeId===id).length+S.permits.filter(x=>x.employeeId===id).length;const fc=fileCount(e);
  confirmBox('Delete employee record?',`This permanently deletes the 201 file of <b>${esc(fullName(e))}</b>${fc?` and its ${fc} uploaded document${fc===1?'':'s'}`:''}.${n?` Their ${n} leave and permit record${n===1?'':'s'} will remain but show as “Former employee”.`:''} To keep the history, set the status to Resigned or Terminated instead.`,'Delete record',async()=>{await deleteEmpRecord(e);if($('#drawer').open)$('#drawer').close();toast('Employee record deleted.')});
}
async function deleteEmpRecord(e){
  const ids=DOCS.flatMap(([k])=>docFiles(e,k).map(f=>f.id)).concat(((e.bank&&e.bank.proof)||[]).map(f=>f.id),(e.soloProof||[]).map(f=>f.id));
  await remove('employees',e.id);
  if(ASSETS)for(const fid of ids){try{await ASSETS.delete(fid)}catch(err){}}
}

function leaveForm(empId){
  const t=today();
  openModal({title:'File Leave',body:`<div class="fg">
    ${field({id:'lf-emp',name:'employeeId',label:'Employee',type:'select',req:1,html:empOpts(empId)})}
    ${field({id:'lf-type',name:'type',label:'Leave type',type:'select',req:1,opts:LEAVE_TYPES})}
    ${field({id:'lf-from',name:'from',label:'From',type:'date',req:1,value:t})}
    ${field({id:'lf-to',name:'to',label:'To',type:'date',req:1,value:t})}
    ${field({id:'lf-reason',name:'reason',label:'Reason',type:'textarea',full:1,req:1})}
    </div><p class="help" id="lf-days" style="margin:0;font-weight:600">1 day (Sundays excluded)</p>`,
    submitLabel:'Submit for approval',
    onOpen:f=>{const u=()=>{const a=f.from.value,b=f.to.value;const n=a&&b&&b>=a?leaveDays(a,b):0;$('#lf-days').textContent=a&&b&&b<a?'The end date is before the start date.':`${n} day${n===1?'':'s'} (Sundays excluded)`};f.from.addEventListener('change',()=>{if(f.to.value<f.from.value)f.to.value=f.from.value;u()});f.to.addEventListener('change',u);u()},
    onSubmit:async(fd,f)=>{
      const from=fd.get('from'),to=fd.get('to');
      if(to<from){setErr(f.querySelector('#lf-to'),'The end date must be on or after the start date.');return false}

      if(glue&&words.length)words[words.length-1].push([p,b]);else words.push([[p,b]]);glue=true}));

    words.forEach(wo=>{const n=ww(wo),l=lines[lines.length-1];if(l.length&&cur+sp+n>w){lines.push([wo]);cur=n}else{cur+=(l.length?sp:0)+n;l.push(wo)}});

  y=para([['The terms and conditions of employment set out in your original contract will continue to apply to your ongoing position.']],y+32,14);
  y=para([['It is understood that you will continue to be bound by the Confidentiality Agreement and Non-Competition Clause incorporated in the Probationary Employment Contract that you signed with us.  Such provisions shall be deemed incorporated as part of the terms and conditions of your regular employment with us.']],y+31,12.2);

  y+=36;put('Sincerely yours,',X,y);y+=36;put('Gladys Espedillon',X,y,{bold:1});put('Owner',X,y+12);
  y+=48;put('WITH MY CONFORMITY:',X,y);y+=36.5;
  /* the employee's name is printed on the Name line; Signature and Date stay blank for them to fill in */

function fileType(f){const t=(f.type||'').toLowerCase();if(Object.values(FILE_TYPES).includes(t))return t;const ext=(f.name.split('.').pop()||'').toLowerCase();return FILE_TYPES[ext]||null}
function upErr(e){const c=e&&e.code;return c==='too_large'?'larger than 20 MB':c==='unsupported_type'?'use PDF, JPG or PNG':c==='quota_or_state'?'document storage is full':c==='rate_limited'?'too many uploads at once, try again in a minute':c==='not_granted'||c==='capability_disabled'?'you do not have upload access':'upload failed, try again'}
async function uploadFiles(empId,k,files){
  if(!ASSETS)return toast('Uploads are not available here.',{kind:'bad'});
  const label=(DOCS.concat([OTHER_DOC]).find(d=>d[0]===k)||[k,k])[1];const key=empId+':'+k;const ok=[],errs=[];
  UPL[key]=true;renderDrawer();
  for(const file of files){
    const type=fileType(file);
    if(!type){errs.push(`${file.name}: use PDF, JPG or PNG (save phone photos as JPG)`);continue}
    if(file.size>20*1048576){errs.push(`${file.name}: larger than 20 MB, compress it first`);continue}
    try{const r=await ASSETS.upload(file,{type});ok.push({id:r.id,name:file.name.slice(0,140),type:r.contentType,size:r.sizeBytes,at:new Date().toISOString(),by:MEID})}
    catch(err){if(err&&err.code==='store_unavailable'){try{await new Promise(r=>setTimeout(r,1200));const r=await ASSETS.upload(file,{type});ok.push({id:r.id,name:file.name.slice(0,140),type:r.contentType,size:r.sizeBytes,at:new Date().toISOString(),by:MEID});continue}catch(e2){err=e2}}errs.push(`${file.name}: ${upErr(err)}`)}
  }
  delete UPL[key];
  if(ok.length&&EMP[empId]){
    const o=clone(EMP[empId]);o.files=o.files||{};o.files[k]=(o.files[k]||[]).concat(ok);o.docs=o.docs||{};if(k!==OTHER_DOC[0])o.docs[k]=true;
    try{await save('employees',o);toast(`${ok.length} file${ok.length===1?'':'s'} added to ${label}.`)}catch(err){for(const f of ok){try{await ASSETS.delete(f.id)}catch(e3){}}}
  }
  renderDrawer();
  if(errs.length)toast(errs.join(' · '),{kind:'bad'});
}
function findFile(empId,ref){const[k,fid]=ref.split('|');const e=EMP[empId];const f=e&&docFiles(e,k).find(x=>x.id===fid);return{e,k,fid,f}}
function viewFile(empId,ref){
  const{e,k,f}=findFile(empId,ref);if(!f)return;const label=(DOCS.find(d=>d[0]===k)||[k,k])[1];const url='/_blob/'+f.id;
  openModal({title:esc(label),wide:1,
    body:`<dl class="summary"><dt>Employee</dt><dd>${esc(fullName(e))}</dd><dt>File</dt><dd>${esc(f.name)}</dd><dt>Uploaded</dt><dd>${fmtTs(f.at)} by ${uname(f.by)} · ${fsize(f.size||0)}</dd></dl>
      ${/^image\//.test(f.type)?`<img src="${esc(url)}" alt="${esc(label)} of ${esc(fullName(e))}" style="width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)">`
      :`<div class="empty" style="border:1px dashed var(--line);border-radius:12px">${ic('pdf')}<strong>PDF document</strong>Open it in a new tab to view or download it.</div>`}`,
    foot:`<button type="button" class="btn ghost left" data-close>Close</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${ic('ext')}Open in new tab</a>`});
  resolveNames();
}
function delFile(empId,ref){
  const{e,k,fid,f}=findFile(empId,ref);if(!f)return;const label=(DOCS.concat([OTHER_DOC]).find(d=>d[0]===k)||[k,k])[1];
  confirmBox('Remove this document?',`This permanently deletes <b>${esc(f.name)}</b> from ${k===OTHER_DOC[0]?'the other documents':`the ${esc(label)} requirement`} of ${esc(fullName(e))}.`,'Remove document',async()=>{
    const o=clone(EMP[empId]);o.files[k]=(o.files[k]||[]).filter(x=>x.id!==fid);if(!o.files[k].length)delete o.files[k];
    await save('employees',o);try{await ASSETS.delete(fid)}catch(err){}toast('Document removed.');
  });
}

   Each applicant is {id:'jf-<submission id>', form:{…answers}, jotform:{submissionId,createdAt}, status, notes, statusHistory, hiredEmployeeId}.
   The answers are kept in sync from Jotform by the jotform-sync function; HR only edits status and notes here. */
const APP_STATUS=['New','Shortlisted','For interview','Hired','Not hired','Blocklisted'];
const APP_CHIP={New:'info',Shortlisted:'warn','For interview':'warn',Hired:'ok','Not hired':'bad',Blocklisted:'blk'};
const appStatus=a=>a.status||'New';

/* The date Jotform received the form; applicants sometimes type a wrong "Date Applied". */
/* Jotform's API gives times in US Eastern time (not the account's Asia/Singapore setting); this turns one into the Philippine date */
const jfDay=t=>{if(!t)return'';const u=Date.parse(String(t).replace(' ','T')+'Z');if(isNaN(u))return'';const m=/GMT([+-]\d+)/.exec(new Date(u).toLocaleString('en-US',{timeZone:'America/New_York',timeZoneName:'shortOffset'}));return new Date(u-(m?+m[1]:-5)*36e5+8*36e5).toISOString().slice(0,10)};
const appDate=a=>jfDay(a.jotform&&a.jotform.createdAt)||(a.form&&a.form.dateApplied)||'';
const appBl=a=>{const f=a.form||{};return blocklistMatch(f.firstName,f.lastName,f.birthDate)};
const titleCase=s=>String(s||'').trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());

let PDFP=null;
function loadPdfLib(){
  if(window.PDFLib)return Promise.resolve(window.PDFLib);if(PDFP)return PDFP;
  PDFP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';s.onload=()=>window.PDFLib?res(window.PDFLib):rej(new Error('missing'));s.onerror=()=>{PDFP=null;rej(new Error('load failed'))};document.head.appendChild(s)});
  return PDFP;
}
/* The built-in PDF font only has Western characters: accented letters keep their base letter, anything else becomes ? */
const WIN_EXTRA='‘’“”–—…•€™';
const pdfSafe=s=>[...String(s)].map(c=>{const n=c.charCodeAt(0);return(n>31&&n<127)||(n>159&&n<256)||WIN_EXTRA.includes(c)?c:(c.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7e\xa0-\xff]/g,'')||'?')}).join('');
function appFormValues(a){
  const f=a.form||{},v={},d=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?fmt(s):(s||''),cap=s=>String(s||'').replace(/^./,c=>c.toUpperCase());
  Object.assign(v,{position:f.position,desiredSalary:f.desiredSalary,availableFrom:d(f.availableFrom),dateApplied:fmt(appDate(a)),
    lastName:f.lastName,firstName:f.firstName,middleName:f.middleName,suffix:f.suffix,presentAddress:f.presentAddress,height:f.height,weight:f.weight,
    facebook:f.facebook,mobile:f.mobile,email:f.email,age:f.age,birthDate:d(f.birthDate),birthPlace:f.birthPlace,
    civilStatus:cap(f.civilStatus),citizenship:f.citizenship,religion:f.religion,gender:cap(f.gender),sss:f.sss,tin:f.tin,philhealth:f.philhealth,pagibig:f.pagibig,
    spouseName:f.spouseName,spouseOccupation:f.spouseOccupation,childrenCount:f.childrenCount,
    childrenList:(f.children||[]).map(c=>c.name+(c.age?` (${c.age})`:'')).join(', '),
    currentlyEmployed:f.currentlyEmployed,formerEmployee:f.formerEmployee,formerWhen:f.formerWhen,hasRelatives:f.hasRelatives,relatives:f.relatives,
    overtime:f.overtime,overtimeReason:f.overtimeReason,sundays:f.sundays,sundaysReason:f.sundaysReason,
    otherQualifications:f.otherQualifications,equipment:f.equipment,licenses:f.licenses,skills:f.skills});
  const em=f.emergency||{};Object.assign(v,{emName:em.name,emRelationship:em.relationship,emAddress:em.address,emPhone:em.phone});

async function appFormDownload(id,btn){
  const a=S.applicants.find(x=>x.id===id);if(!a)return;
  const dl=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads').catch(()=>null):null;
  if(!dl)return toast('Downloads are not available in this view.',{kind:'bad'});
  const t=btn.innerHTML;btn.disabled=true;btn.textContent='Preparing…';
  try{
    const get=(u,t)=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r[t]()});
    const[L,buf,lay]=await Promise.all([loadPdfLib(),get('application-form.pdf','arrayBuffer'),get('application-form.json','json')]);
    const src=await L.PDFDocument.load(buf),doc=await L.PDFDocument.create(),v=appFormValues(a);
    /* Unused rows at the end of the family and reference tables are cut out and the rest of that page moves up.
       The page is rebuilt from three slices: above the cut, below it (shifted up), and the bottom border; the
       border's side bars are redrawn over the space freed at the bottom. Positions here are from the top. */
    const cuts={};(lay.tables||[]).forEach(t=>{
      const used=t.rows.map(([k])=>t.cols.some(c=>String(v[k+c]||'').trim()));let n=t.rows.length;while(n>t.keep&&!used[n-1])n--;
      if(n<t.rows.length)cuts[t.page]={from:t.rows[n][1],to:t.rows[t.rows.length-1][2],gap:t.rows[t.rows.length-1][2]-t.rows[n][1]}});
    const B=lay.border;
    for(let pi=0;pi<src.getPageCount();pi++){
      const sp=src.getPage(pi),c=cuts[pi];
      if(!c){const[cp]=await doc.copyPages(src,[pi]);doc.addPage(cp);continue}
      const{width:W,height:H}=sp.getSize(),Y=t=>H-t,a1=c.from+.6,b1=c.to+.6,bb=B.bottom-2;
      const[top,mid,bot]=await doc.embedPages([sp,sp,sp],[{left:0,right:W,bottom:Y(a1),top:H},{left:0,right:W,bottom:Y(bb),top:Y(b1)},{left:0,right:W,bottom:0,top:Y(bb)}]);
      const pg=doc.addPage([W,H]);
      pg.drawPage(top,{x:0,y:Y(a1)});pg.drawPage(mid,{x:0,y:Y(bb)+c.gap});pg.drawPage(bot,{x:0,y:0});
      B.sides.forEach(([x0,x1])=>pg.drawRectangle({x:x0,y:Y(bb)-.1,width:x1-x0,height:c.gap+.2,color:L.rgb(0,0,0)}));
    }
    const font=await doc.embedFont(L.StandardFonts.TimesRoman);const pages=doc.getPages();
    lay.fields.forEach(([k,pi,x,y,w])=>{
      let t=pdfSafe(String(v[k]==null?'':v[k]).replace(/\s+/g,' ').trim());if(!t)return;
      const c=cuts[pi];if(c&&y>c.to)y-=c.gap;
      /* 10 pt, smaller for long answers so they stay on the line */
      let size=10;while(size>6&&font.widthOfTextAtSize(t,size)>w)size-=.5;
      while(t.length>1&&font.widthOfTextAtSize(t,size)>w)t=t.slice(0,-2)+'…';
      const pg=pages[pi];pg.drawText(t,{x,y:pg.getHeight()-y,size,font,color:L.rgb(0,0,.55)});
    });
    const f=a.form||{};doc.setTitle(`Application for Employment - ${[f.firstName,f.lastName].filter(Boolean).join(' ')}`);doc.setAuthor('Golden Bear Manpower Agency');
    const blob=new Blob([await doc.save()],{type:'application/pdf'});
    await dl.save({filename:`Application Form - ${[f.lastName,f.firstName].filter(Boolean).join(', ')||'Applicant'}.pdf`.replace(/[\\/:*?"<>|]/g,''),data:blob});
  }catch(err){const c=err&&err.code;if(c!=='declined')toast('The application form could not be prepared. Check your connection and try again.',{kind:'bad'})}
  finally{btn.disabled=false;btn.innerHTML=t}
}

GR.addEventListener('keydown',ev=>{const bs=[...GR.querySelectorAll('button')];const i=bs.indexOf(document.activeElement);if(ev.key==='ArrowDown'&&bs[i+1]){ev.preventDefault();bs[i+1].focus()}if(ev.key==='ArrowUp'){ev.preventDefault();(bs[i-1]||GQ).focus()}if(ev.key==='Escape')GQ.focus()});
GR.addEventListener('click',ev=>{const b=ev.target.closest('[data-gid]');if(!b)return;GR.hidden=true;GQ.value='';GS.classList.remove('open');openEmp(b.dataset.gid)});
document.addEventListener('click',ev=>{if(!GS.contains(ev.target)){GR.hidden=true;GS.classList.remove('open');GQ.setAttribute('aria-expanded','false')}});

/* ---------------- profile menu (top right): Settings for admins, Sign out ---------------- */
const MEB=$('#me'),MEM=$('#me-menu');
function meMenu(open){
  if(open){
    MEM.innerHTML=`<div class="who"><b>${esc(ME.name||'Signed in')}</b><span>${esc(ME.email||'')}</span></div>
      ${ME.role==='admin'?`<button type="button" role="menuitem" data-act="me-settings">${ic('gear')}Settings</button>`:''}
      ${USER&&USER.signOut?`<button type="button" role="menuitem" data-act="me-signout">${ic('arrow')}Sign out</button>`:''}`;
  }
  MEM.hidden=!open;MEB.setAttribute('aria-expanded',String(open));
  if(open){const b=MEM.querySelector('button');if(b)b.focus()}
}
MEB.addEventListener('click',ev=>{ev.stopPropagation();meMenu(MEM.hidden)});
document.addEventListener('click',ev=>{if(!MEM.hidden&&!MEM.contains(ev.target))meMenu(false)});
MEM.addEventListener('keydown',ev=>{if(ev.key==='Escape'){meMenu(false);MEB.focus()}});

/* ---------------- boot ---------------- */
async function init(){
  render(false);
  let db=null,user=null,assets=null;
  try{if(window.claude&&typeof window.claude.use==='function'){[db,user,assets]=await Promise.all([window.claude.use('db').catch(()=>null),window.claude.use('user').catch(()=>null),window.claude.use('assets').catch(()=>null)])}}catch(e){}
  USER=user;ASSETS=db?assets:null;
  if(user){
    try{const me=await user.me();MEID=me.id;ME={role:me.role||'staff',approver:me.approver||'',access:me.access||null,name:me.name||'',email:me.email||''};const av=$('#me');if(me.name){av.title=me.name;av.textContent=me.name.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase()}}catch(e){}
    try{if(await user.can('data.write')===false)document.body.classList.add('ro')}catch(e){}
  }
  if(db){
    DB=db;MODE='db';const got=new Set();
    $('#syncdot').classList.add('live');$('#synctext').textContent='Records are saved and shared with your HR team.';
    db.doc('config/attendance').onSnapshot(s=>{const d=s.exists?s.data():null;ATTSET={...ATT_DEF,...(d||{})};if(MODE==='db')refresh()},()=>{});
    db.doc('config/app').onSnapshot(s=>{const was=DEMO;DEMO=!!(s.exists&&s.data()&&s.data().demo);const bar=$('#demobar');bar.hidden=!DEMO;
      if(DEMO)bar.innerHTML=`${ic('info')}<span><b>Demo system.</b> Every employee, client record, ID, bank number and document here is fictional sample data for review only.${document.body.classList.contains('ro')?' You are viewing it read-only.':''}</span>`;
      if(was!==DEMO&&MODE==='db')refresh()},()=>{});
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.add(c);if(got.size===COLS.length)refresh()},()=>{toast('Live updates stopped. Reload the page to reconnect.',{kind:'bad'})}));
  }else{
    MODE='local';
    try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);COLS.forEach(c=>S[c]=Array.isArray(o[c])?o[c]:[]);if(o.attset)ATTSET={...ATT_DEF,...o.attset}}}catch(e){}
    $('#synctext').textContent='Offline mode: records are saved in this browser only.';
    refresh();
  }
}
init();
})();
</script>
