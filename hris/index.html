<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Manpower HRIS</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed navy sidebar (brand + grouped nav) beside a warm off-white workspace of white cards, matching the Head Office Dashboard reference. */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f2f0ea; --ink:#121a2c; --muted:#596175; --line:#e4e1d9;
  --side:#0f1e3f; --side-ink:#eef1f8; --side-muted:#a3aec8; --side-line:#223360; --side-hover:#182a52; --side-active:#1d3163;
  --gold:#f3c623; --btn:#0f1e3f; --btn-ink:#ffffff; --btn-hover:#1b2f5c;
  --bar:#3b6ea8; --bar-track:#efede7;
  --ok:#1b6e45; --ok-bg:#e1f2e8; --warn:#8a5300; --warn-bg:#fcefd6; --bad:#ac2a20; --bad-bg:#fae4e1; --info:#28589c; --info-bg:#e4ecf8; --neutral:#4d5568; --neutral-bg:#ecebe5;
  --focus:#2f6fd6; --scrim:rgba(9,15,32,.52);
  --shadow:0 1px 2px rgba(15,30,63,.05),0 6px 18px rgba(15,30,63,.05);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#131b2e; --surface-2:#1a2339; --ink:#e8ecf5; --muted:#a0a9bd; --line:#27324c;
  --side:#08102a; --side-ink:#e8ecf5; --side-muted:#95a1bd; --side-line:#1b284a; --side-hover:#122044; --side-active:#182a57;
  --gold:#f3c623; --btn:#f3c623; --btn-ink:#0f1e3f; --btn-hover:#f7d65a;
  --bar:#6c9bd6; --bar-track:#1f2941;
  --ok:#72d6a0; --ok-bg:#133526; --warn:#f3c26b; --warn-bg:#382a0f; --bad:#ff9186; --bad-bg:#3b1a18; --info:#90b6f0; --info-bg:#172a49; --neutral:#b4bccd; --neutral-bg:#212b43;
  --focus:#90b6f0; --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#131b2e; --surface-2:#1a2339; --ink:#e8ecf5; --muted:#a0a9bd; --line:#27324c;
  --side:#08102a; --side-ink:#e8ecf5; --side-muted:#95a1bd; --side-line:#1b284a; --side-hover:#122044; --side-active:#182a57;
  --gold:#f3c623; --btn:#f3c623; --btn-ink:#0f1e3f; --btn-hover:#f7d65a;
  --bar:#6c9bd6; --bar-track:#1f2941;
  --ok:#72d6a0; --ok-bg:#133526; --warn:#f3c26b; --warn-bg:#382a0f; --bad:#ff9186; --bad-bg:#3b1a18; --info:#90b6f0; --info-bg:#172a49; --neutral:#b4bccd; --neutral-bg:#212b43;
  --focus:#90b6f0; --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--btn);color:var(--btn-ink);padding:10px 14px;border-radius:10px;font-weight:700}
.skip:focus{top:12px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100%}
.app.side-off{grid-template-columns:0 minmax(0,1fr)}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:40}
.app.side-off .side{visibility:hidden}
.brand{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:2px solid color-mix(in srgb,var(--gold) 55%,transparent)}
.logo{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px rgba(243,198,35,.25)}
.logo svg{width:30px;height:30px}
.b1{font-weight:800;font-size:18px;letter-spacing:.01em}
.b2{font-weight:700;font-size:13px;color:var(--gold);letter-spacing:.05em}
.nav{padding:14px 12px 20px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav a,.grp{display:flex;align-items:center;gap:14px;min-height:46px;padding:0 14px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-size:16.5px;font-weight:500;background:none;border:0;width:100%;text-align:left}
.nav a svg{color:var(--side-muted)}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-active);font-weight:700}
.nav a[aria-current="page"] svg{color:var(--gold)}
.nav a .cnt{margin-left:auto;background:var(--gold);color:#0f1e3f;font-size:12px;font-weight:800;min-width:24px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 7px}
.grp{margin-top:14px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);min-height:40px}
.grp:hover{color:var(--side-ink)}
.grp .gb{margin-left:auto;background:var(--side-line);color:var(--side-ink);font-size:11.5px;min-width:22px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;letter-spacing:0}
.grp .chev{transition:transform .2s}
.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.side-foot{padding:14px 20px 20px;border-top:1px solid var(--side-line);font-size:13px;color:var(--side-muted);display:flex;gap:10px;align-items:flex-start}
.side-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted);margin-top:6px;flex:none}
.side-foot .dot.live{background:#4fd18b}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 24px;min-height:70px}
.icon-btn{width:44px;height:44px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.top h1{font-size:21px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch{position:relative;width:min(400px,40vw)}
.gsearch input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 70px 0 44px;font-size:15px}
.gsearch>svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.gsearch kbd{position:absolute;right:10px;top:11px;font:600 11.5px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--muted);background:var(--surface-2)}
.gres{position:absolute;top:52px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(10,20,45,.16);padding:6px;z-index:50}
.gres button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:10px;border-radius:8px}
.gres button:hover,.gres button:focus-visible{background:var(--surface-2)}
.gres .none{padding:12px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--side);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;overflow:hidden;border:2px solid var(--surface)}
.avatar img{width:100%;height:100%;object-fit:cover}
.scrim{display:none}

#view{padding:28px 30px 60px;outline:none;display:flex;flex-direction:column;gap:22px;max-width:1520px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h2{font-size:30px;font-weight:800}
.ph p{margin:4px 0 0;color:var(--muted);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 28px;min-width:0}
.card>h3{font-size:19px;font-weight:600;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:19px;font-weight:600}
.link{background:none;border:0;color:var(--info);font-weight:600;padding:6px 4px;font-size:14.5px;display:inline-flex;gap:6px;align-items:center}
.link:hover{text-decoration:underline}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 20px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:148px;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--bar) 45%,var(--line))}
.tile b{font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;color:var(--muted);font-size:16px;line-height:1.35}
.tile span svg{color:var(--muted);width:18px;height:18px}
.tile.alert b{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:15.5px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn.bad-ghost{background:var(--surface);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.bad-ghost:hover{background:var(--bad-bg)}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:8px}
.btn svg{width:18px;height:18px}
.qa{display:flex;gap:12px;flex-wrap:wrap}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:700}
.row .meta{color:var(--muted);font-size:14.5px}
.row .dt{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14.5px}
button.row{background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;border-radius:0}
button.row:hover .nm{text-decoration:underline}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16.5px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* bars */
.bars{display:grid;grid-template-columns:minmax(110px,190px) 1fr 36px;gap:12px 16px;align-items:center}
.bars .bl{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.bars .bt{height:24px;background:var(--bar-track);border-radius:6px;overflow:hidden}
.bars .bf{height:100%;background:var(--bar);border-radius:6px}
.bars .bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.chip svg{width:14px;height:14px;stroke-width:2.4}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.sample{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}

/* toolbar + tabs */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.toolbar .srch{position:relative;flex:1 1 240px;max-width:380px}
.toolbar .srch svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.toolbar .srch input{padding-left:42px}
.toolbar select{flex:0 1 200px}
.att-tb .srch{flex:1 1 150px;min-width:0}
@media (min-width:901px){.att-tb{flex-wrap:nowrap}.att-tb>input,.att-tb>select{min-width:0}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center;min-height:46px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--btn)}
.tabs .n{background:var(--surface-2);border-radius:10px;padding:0 8px;font-size:12.5px;font-variant-numeric:tabular-nums;line-height:20px}

/* tables */
.tw{overflow-x:auto;margin:0 -8px}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:760px}
.tbl th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .nm{font-weight:700}
.tbl .sub{color:var(--muted);font-size:13.5px}
.tbl .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tbl td.r,.tbl th.r{text-align:right}
.ms{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.ms .d{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px}
.prog .t{width:80px;height:8px;border-radius:4px;background:var(--bar-track);overflow:hidden}
.prog .f{height:100%;background:var(--bar)}
.prog .f.full{background:var(--ok)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14.5px}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--info-bg);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:14.5px}
.banner svg{color:var(--info)}
.banner .grow{flex:1;min-width:200px}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 24px 60px rgba(5,12,30,.35);width:min(640px,calc(100vw - 32px));max-height:min(90vh,900px)}
dialog.wide{width:min(900px,calc(100vw - 32px))}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.mform{display:flex;flex-direction:column;max-height:inherit}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px 24px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:20px;font-weight:700}
.mbody{padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mfoot .left{margin-right:auto}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 16px 18px;margin:0;min-width:0}
legend{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0 6px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:14px}
.field label .req{color:var(--bad)}
.field .help{color:var(--muted);font-size:13px;margin:0}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 12px;font-size:15.5px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
[aria-invalid="true"]{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:13.5px;margin:0;font-weight:600}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px}
.ck{display:flex;gap:10px;align-items:center;min-height:40px;font-size:15px;cursor:pointer}
.ck input{width:20px;height:20px;min-height:0;accent-color:var(--bar);flex:none}
.summary{background:var(--surface-2);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.summary dt{color:var(--muted)} .summary dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.formerr{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600}

/* drawer */
#drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(600px,100vw);border-radius:0;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.dwrap{display:flex;flex-direction:column;height:100%}
.dhead{padding:20px 20px 0 24px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.dtop{display:flex;gap:14px;align-items:flex-start}
.dtop .avatar{width:56px;height:56px;font-size:19px}
.dtop h2{font-size:22px;font-weight:800}
.dtop p{margin:2px 0 0;color:var(--muted)}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dacts{display:flex;gap:8px;flex-wrap:wrap}
.dbody{padding:20px 24px 40px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.kv div{min-width:0}
.kv dt{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kv dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.sect h4{margin:0 0 10px;font-size:15px;font-weight:700}
.tl{display:flex;flex-direction:column}
.tl .st{display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:18px;position:relative}
.tl .st:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.tl .bub{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--neutral-bg);color:var(--neutral);font-weight:800;font-size:13px}
.tl .bub.ok{background:var(--ok-bg);color:var(--ok)} .tl .bub.bad{background:var(--bad-bg);color:var(--bad)} .tl .bub.warn{background:var(--warn-bg);color:var(--warn)}
.tl .bub svg{width:16px;height:16px;stroke-width:2.6}
.tl h5{margin:5px 0 2px;font-size:15.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl p{margin:0;color:var(--muted);font-size:14.5px}

/* 201 document uploads */
svg.i.sm{width:14px;height:14px}

const parse=s=>{if(!s)return null;const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
function addMonths(s,n){const d=parse(s);const day=d.getDate();const r=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(day,last));return iso(r)}

/* ---------------- derived ---------------- */
const isProb=e=>e.employmentType==='Probationary'&&empStatus(e)==='Active';
const isActive=e=>empStatus(e)==='Active';
function msState(due,done,soon){if(done)return'done';const d=diff(today(),due);if(d<0)return'overdue';if(d<=soon)return'soon';return'upcoming'}
function milestones(e){
  if(!e.hireDate)return null;const prob=isProb(e);
  const items=MS.map(m=>{const due=addMonths(e.hireDate,m.n);const rec=e.evals&&e.evals[m.k];const done=!!(rec&&rec.date);return{...m,due,rec,state:done?'done':(prob?msState(due,false,14):'na')}});
  const regDue=addMonths(e.hireDate,6);
  const regDone=!!e.regularizedOn||e.employmentType==='Regular';
  return{items,reg:{due:regDue,done:regDone,on:e.regularizedOn,state:regDone?'done':(prob?msState(regDue,false,30):'na')}};
}
function stateChip(state,due){
  if(state==='done')return`<span class="chip ok">${ic('check')}Done</span>`;
  if(state==='overdue'){const d=-diff(today(),due);return`<span class="chip bad">${ic('alert')}Overdue ${d}d</span>`}
  if(state==='soon'){const d=diff(today(),due);return`<span class="chip warn">${ic('clock')}${d===0?'Due today':'Due in '+d+'d'}</span>`}
  if(state==='na')return`<span class="chip">Not recorded</span>`;
  return`<span class="chip">Upcoming</span>`;
}
const statusChip=s=>{const m={Pending:'warn',Approved:'ok',Declined:'bad',Closed:'',Open:'warn',Acknowledged:'info',Draft:''}[s];const i={Pending:'clock',Approved:'check',Declined:'x2',Open:'clock',Acknowledged:'check',Draft:'edit'}[s];if(s==='Draft')return`<span class="chip">${ic('edit')}Draft · not sent</span>`;if(s==='Sent')return`<span class="chip info">${ic('send')}Sent</span>`;if(s==='Issued')return`<span class="chip ok">${ic('check')}Issued</span>`;return`<span class="chip ${m||''}">${i?ic(i):''}${esc(s)}</span>`};
const typeChip=t=>`<span class="chip ${t==='Regular'?'ok':t==='Probationary'?'info':''}">${esc(t||'—')}</span>`;
const empStatusChip=e=>{const s=typeof e==='string'?e:empStatus(e);return s==='Active'?`<span class="chip ok">Active</span>`:s==='Blocklisted'?`<span class="chip blk">${ic('x2')}Blocklisted</span>`:`<span class="chip sep">Separated</span>`};
function statusSub(e){const s=empStatus(e);if(s==='Separated')return`${esc(sepReason(e)||'Reason not recorded')}${e.separationDate?' · '+fmt(e.separationDate):''}`;if(s==='Blocklisted')return`${esc(e.blocklistReason||'Reason not recorded')}${e.blocklistDate?' · '+fmt(e.blocklistDate):''}`;return''}
function statusBanner(e){const s=empStatus(e);if(s==='Active')return'';
  if(s==='Separated')return`<div class="banner st-sep">${ic('info')}<span class="grow"><b>Separated</b> · ${esc(sepReason(e)||'Reason not recorded')}${e.separationDate?` · effective ${fmt(e.separationDate)}`:''}${e.separationDetails?`<br>${esc(e.separationDetails)}`:''}<br><span style="color:var(--muted)">${e.rehireEligible==='No'?'Not eligible for rehire.':e.rehireEligible==='Yes'?'Eligible for rehire.':'Rehire eligibility not recorded.'}</span></span></div>`;
  return`<div class="banner st-bl">${ic('alert')}<span class="grow"><b>Blocklisted</b> · ${esc(e.blocklistReason||'Reason not recorded')}${e.blocklistDate?` · since ${fmt(e.blocklistDate)}`:''}${e.blocklistDetails?`<br>${esc(e.blocklistDetails)}`:''}<br><b>Do not rehire or redeploy.</b></span></div>`}
const docFiles=(e,k)=>(e.files&&e.files[k])||[];
const docHas=(e,k)=>!!((e.docs&&e.docs[k])||docFiles(e,k).length);
const docCount=e=>docsFor(e).filter(([k])=>docHas(e,k)).length;
const fileCount=e=>DOCS.reduce((s,[k])=>s+docFiles(e,k).length,0);
const fsize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const soloExpired=e=>!!(e.soloParent&&e.soloParentValidUntil&&e.soloParentValidUntil<today());
const soloChip=e=>e&&e.soloParent?` <span class="chip ${soloExpired(e)?'warn':'solo'}" title="${soloExpired(e)?'Solo Parent ID expired':'Solo parent'}">${ic('users')}Solo parent${soloExpired(e)?' · ID expired':''}</span>`:'';
const sampleChip=o=>o&&o.sample?' <span class="chip sample">Sample</span>':'';
const uname=id=>id?`<span data-uid="${esc(id)}">HR</span>`:'HR';
function nextNo(col,prefix){const y=new Date().getFullYear();const re=new RegExp('^'+prefix+'-'+y+'-(\\d+)$');let max=0;S[col].forEach(x=>{const m=re.exec(x.no||'');if(m)max=Math.max(max,+m[1])});return`${prefix}-${y}-${String(max+1).padStart(3,'0')}`}
function nextEmpNo(client,hire){return makeEmpId(client||'',hire||today(),nextSeq())}
/* Internal = GBMA office staff (employees assigned to Head Office). External = deployed employees and outside parties. */
const OFFICE='Head Office';
const GBMA_DEPTS=['Human Resources','Recruitment','Operations','Admin','Payroll','Management'];
const ORG_KINDS=['Client','Applicant','Supplier','Business partner','Government / regulatory office'];
const INT_TYPES=['Disciplinary','Notice to Explain','Written Warning','Notice of Decision','Policy & Procedures','General Announcement','Reminder','Commendation','Other'];
const EXT_TYPES=['Holiday Work Arrangement','No Work Arrangement','Advisory','Announcement','Notice to Explain','Written Warning','Notice of Decision','Endorsement','Request','Reply','Letter','Billing / Statement','Other',REG_TYPE,EOP_TYPE];
const isOffice=e=>!!e&&e.client===OFFICE;
const isLetter=m=>m.toType==='org'||m.toType==='external';
function memoScope(m){if(m.scope)return m.scope;if(m.toType==='office'||m.toType==='department')return'internal';if(m.toType==='employee')return isOffice(EMP[m.toValue])?'internal':'external';return'external'}
const isExt=m=>memoScope(m)==='external';
function recGroup(m){if(isLetter(m))return m.orgKind||(CLIENTS.includes(m.toCompany)?'Client':'Outside party');return isExt(m)?'Deployed employees':'GBMA office staff'}
function memoTo(m){if(isLetter(m))return[m.toName,m.toCompany].filter(Boolean).join(', ');if(m.toType==='office')return'All GBMA Office Staff';if(m.toType==='deployed')return'All Deployed Employees';if(m.toType==='all')return'All Employees';if(m.toType==='solo')return'All Solo Parent Employees';if(m.toType==='client')return`All staff deployed at ${m.toValue}`;if(m.toType==='department')return`${m.toValue} Department`;return fullName(EMP[m.toValue])}
function evalQueue(days){
  const t=today(),out=[];
  S.employees.filter(isProb).forEach(e=>{const ms=milestones(e);if(!ms)return;
    ms.items.forEach(m=>{if(m.state!=='done'&&diff(t,m.due)<=days)out.push({e,label:m.label+' evaluation',due:m.due,state:m.state,k:m.k})});
    if(!ms.reg.done&&diff(t,ms.reg.due)<=days)out.push({e,label:'Regularization',due:ms.reg.due,state:ms.reg.state,k:'reg'});
  });
  return out.sort((a,b)=>a.due<b.due?-1:1);
}

/* ---- Attendance ----
   One document per employee per month: attendance/<employeeId>_<YYYY-MM> = {employeeId, month, days:{date:{in,out,status}}}.
   Late = time in after shift start + grace (minutes counted from shift start). Undertime = time out before shift end.
   Sunday is the rest day. Approved leaves show automatically. Perfect = every workday present, no late, no undertime,
   no absence, no leave, no missing record. */
const LATE_STEPS=['Coaching and verbal reminder from the site coordinator, noted in the 201 file.','Written Warning (WW memo).','Notice to Explain (NTE), then Notice of Decision per the Code of Conduct.','Notice to Explain (NTE); suspension may be imposed per the Code of Conduct.'];
const ATT_DEF={start:'08:00',end:'17:00',grace:0,lateMax:3,utMax:3,lookback:6,steps:LATE_STEPS,notes:'',lateUnit:1,lateUnits:{}};
/* Late counting per site: 1 = actual minutes (1 min late = 1 min). 30 = every started 30 minutes counts as 30 (1–30 min late = 30, 31–60 = 60). */
const LATE_UNITS=[[1,'Actual minutes (1 min = 1 min)'],[15,'Per 15 minutes (1–15 min = 15)'],[30,'Per 30 minutes (1–30 min = 30)'],[60,'Per hour (1–60 min = 60)']];
const unitOk=v=>LATE_UNITS.some(x=>x[0]===+v);
const lateUnitOf=client=>{const v=+((ATTSET.lateUnits||{})[client]);return unitOk(v)?v:(unitOk(ATTSET.lateUnit)?+ATTSET.lateUnit:1)};
const unitShort=u=>u>1?`per ${u===60?'hour':u+' minutes'}`:'actual minutes';
const lateCharge=(m,u)=>m>0&&u>1?Math.ceil(m/u)*u:m;
const lateMax=()=>Math.max(0,parseInt(ATTSET.lateMax,10)||0),utMax=()=>Math.max(0,parseInt(ATTSET.utMax,10)||0);
const lateSteps=()=>(Array.isArray(ATTSET.steps)&&ATTSET.steps.filter(x=>String(x).trim()).length?ATTSET.steps:LATE_STEPS).filter(x=>String(x).trim());
let ATTSET={...ATT_DEF};
const tmin=t=>{if(!t)return null;const p=String(t).split(':').map(Number);return p[0]*60+(p[1]||0)};
const hm=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
function monthDays(m){const[y,mo]=m.split('-').map(Number);const n=new Date(y,mo,0).getDate();return Array.from({length:n},(_,i)=>`${m}-${pad(i+1)}`)}
const fmtMonth=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};
const schedOf=e=>({start:e.shiftStart||ATTSET.start,end:e.shiftEnd||ATTSET.end,grace:+(ATTSET.grace||0)});
const attDoc=(empId,m)=>S.attendance.find(a=>a.id===`${empId}_${m}`);
const leaveOn=(empId,d)=>S.leaves.find(l=>l.employeeId===empId&&l.status==='Approved'&&l.from<=d&&d<=l.to);
function dayInfo(e,d,rec,sc){
  const r=rec||{};const t=today();
  if(e.hireDate&&d<e.hireDate)return{st:'na'};
  const sepD=empStatus(e)!=='Active'?(e.separationDate||e.blocklistDate||''):'';if(sepD&&d>sepD)return{st:'na'};
  if(d>t||(d===t&&!r.in&&!r.status))return{st:'future'};
  if(r.status==='holiday')return{st:'holiday'};
  const rest=parse(d).getDay()===0;
  if(r.status==='restday'||(rest&&!r.status))return r.in?{st:'restwork',in:r.in,out:r.out}:{st:'restday'};
  const lv=leaveOn(e.id,d);
  if(lv&&!r.in&&r.status!=='absent')return{st:'leave',leave:lv.type};
  if(r.status==='absent')return{st:'absent'};
  if(r.in){let i=tmin(r.in),o=r.out?tmin(r.out):null,s=tmin(sc.start),en=tmin(sc.end);
    if(en<=s){en+=1440;if(o!=null&&o<=s)o+=1440;if(i<s-360)i+=1440}
    return{st:'present',in:r.in,out:r.out,late:i>s+sc.grace?i-s:0,ut:o!=null&&o<en?en-o:0,incomplete:o==null}}
  return{st:'norecord'};
}
/* ---- Payroll cut-off periods ----
   Each site has cut-off start days, e.g. "11, 26" = 11th–25th and 26th–10th of the next month. Default "1, 16" = 1st–15th and 16th–end. */
const rangeDays=(a,b)=>{const out=[];for(let d=a;d<=b&&out.length<400;d=addDays(d,1))out.push(d);return out};
const monthRange=m=>{const ds=monthDays(m);return[ds[0],ds[ds.length-1]]};
const fmtRange=(a,b)=>{const m=a.slice(0,7);const[f,l]=monthRange(m);return a===f&&b===l?fmtMonth(m):`${fmtS(a)} – ${fmt(b)}`};
const parseStarts=raw=>{const v=[...new Set(String(raw||'').split(/[^\d]+/).map(Number).filter(n=>n>=1&&n<=28))].sort((x,y)=>x-y);return v};
/* A site's cut-off is either twice a month or weekly.
   cutoffs[site] = "11, 26" (periods start on the 11th and 26th) or "weekly:3" (Wednesday to Tuesday; 0 = Sunday).
   paydays[site] = "30, 15" (payday of each period, in the same order as the start days) or "6" (weekly payday, Saturday). */
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const nth=n=>n+(n%100>10&&n%100<14?'th':['th','st','nd','rd'][n%10]||'th');
function specOf(raw,pay){
  const r=String(raw||'').trim(),w=/^weekly:([0-6])$/.exec(r);
  if(w){const p=String(pay==null?'':pay).trim();return{kind:'weekly',start:+w[1],pay:/^[0-6]$/.test(p)?+p:null}}
  const s=parseStarts(r);if(!s.length)return null;
  const ps=String(pay||'').split(/[^\d]+/).filter(Boolean).map(Number);
  return{kind:'semi',starts:s,pays:s.map((_,i)=>ps[i]>=1&&ps[i]<=31?ps[i]:null)};
}
function cutoffSpec(client){const c=client&&(ATTSET.cutoffs||{})[client];return(c&&specOf(c,(ATTSET.paydays||{})[client]))||specOf(ATTSET.cutoff||'1, 16',ATTSET.payday)||specOf('1, 16','')}
const cutoffStarts=client=>{const sp=cutoffSpec(client);return sp.kind==='semi'?sp.starts:[1,16]};
function specLabel(sp){
  if(sp.kind==='weekly')return`Weekly, ${WD[sp.start]} to ${WD[(sp.start+6)%7]}${sp.pay!=null?` · payday ${WD[sp.pay]}`:''}`;
  return sp.starts.map((d,i)=>{const nx=sp.starts[i+1];const r=nx?`${nth(d)}–${nth(nx-1)}`:(d===1?'1st–end':`${nth(d)}–${sp.starts[0]===1?'end':nth(sp.starts[0]-1)}`);return r+(sp.pays[i]?` · payday ${nth(sp.pays[i])}`:'')}).join(' / ');
}
const cutoffLabel=client=>specLabel(cutoffSpec(client));
/* Cut-off periods that overlap from–to */
function specPeriods(sp,from,to){
  if(sp.kind==='weekly'){let x=addDays(from,-((parse(from).getDay()-sp.start+7)%7));const out=[];for(;x<=to&&out.length<120;x=addDays(x,7))out.push([x,addDays(x,6)]);return out}
  const d=parse(from),months=Math.ceil(diff(from,to)/28)+2,pts=[];
  for(let k=-1;k<=months;k++)sp.starts.forEach(s=>pts.push(iso(new Date(d.getFullYear(),d.getMonth()+k,s))));pts.sort();
  const out=[];for(let i=0;i<pts.length-1;i++){const x=pts[i],y=addDays(pts[i+1],-1);if(y>=from&&x<=to)out.push([x,y])}return out;
}
/* Payday of a period: weekly = the next payday weekday on or after the last day; twice a month = the first date on or after the last day that falls on that period's payday (30 becomes the last day in February). */
function payDate(sp,p){
  const y=p[1];
  if(sp.kind==='weekly')return sp.pay==null?'':addDays(y,(sp.pay-parse(y).getDay()+7)%7);
  const i=sp.starts.indexOf(+p[0].slice(8,10)),D=i>=0?sp.pays[i]:null;if(!D)return'';
  const dt=parse(y);for(let k=0;k<3;k++){const last=new Date(dt.getFullYear(),dt.getMonth()+k+1,0).getDate();const c=iso(new Date(dt.getFullYear(),dt.getMonth()+k,Math.min(D,last)));if(c>=y)return c}
  return'';
}
const periodPay=(client,a,b)=>{const sp=cutoffSpec(client);return specPeriods(sp,a,a).some(p=>p[0]===a&&p[1]===b)?payDate(sp,[a,b]):''};
function attSummaryRange(e,a,b){

function polDraft(){return{start:ATTSET.start,end:ATTSET.end,grace:+ATTSET.grace||0,cutoff:ATTSET.cutoff||'1, 16',cutoffs:{...(ATTSET.cutoffs||{})},payday:ATTSET.payday??'',paydays:{...(ATTSET.paydays||{})},
  lateMax:lateMax(),utMax:utMax(),lookback:parseInt(ATTSET.lookback,10)||6,steps:lateSteps().slice(),notes:ATTSET.notes||'',lateUnit:unitOk(ATTSET.lateUnit)?+ATTSET.lateUnit:1,lateUnits:{...(ATTSET.lateUnits||{})}}}

const polRaw=(d,c)=>c?(d.cutoffs[c]||''):(d.cutoff||'');
const polPayRaw=(d,c)=>c?(d.paydays[c]??''):(d.payday??'');

function polCells(d,c){

      <td><select data-pol="pay-w" ${dc} aria-label="${lbl} payday"><option value="">Not set</option>${WD.map((w,i)=>`<option value="${i}" ${sp.pay===i?'selected':''}>Every ${w}</option>`).join('')}</select></td>`}

async function polSave(){

  const bad=rows.filter(r=>!specOf(r[2],r[3]));
  if(bad.length)return toast(`Check the cut-off days for ${bad.map(x=>x[0]).join(', ')}. Use days 1 to 28, e.g. 11, 26.`,{kind:'bad'});

  let h=ph('Internal Memos','Memos for GBMA office staff: HR, Recruitment, Operations, Admin, Payroll and Management. For example disciplinary notices, policies and procedures, and general announcements.',`<button class="btn ghost" data-act="issue-memo" data-k="Notice to Explain" data-write>Notice to Explain</button><button class="btn" data-act="issue-memo" data-write>${ic('plus')}New Internal Memo</button>`);
  h+=`<section class="card">${tabsHtml('memo',['Open','Draft','Acknowledged','Closed','All'].map(s=>[s,cnt(s)]),f.tab)}<div class="toolbar" style="margin:14px 0 6px">${searchBox('f-memo-q','memo.q',f.q,'Search memo no., subject, recipient')}
    <label class="sr" for="f-memo-type">Memo type</label><select id="f-memo-type" data-filter="memo.type"><option value="">All memo types</option>${INT_TYPES.concat([REG_TYPE,EOP_TYPE]).map(d=>`<option ${d===f.type?'selected':''}>${esc(d)}</option>`).join('')}</select></div>`;
  if(!list.length)h+=emptyBlock('No internal memos here','Memos to GBMA office staff appear here. Open cases stay on the Open tab until acknowledged or closed.',`<div data-write><button class="btn" data-act="issue-memo">${ic('plus')}New Internal Memo</button></div>`);
  else h+=`<div class="tw"><table class="tbl"><thead><tr><th>Memo No.</th><th>Subject</th><th>Type</th><th>To</th><th>Issued</th><th>Status</th></tr></thead><tbody>
    ${list.map(memoRow).join('')}
  </tbody></table></div>`;
  return h+'</section>';
};

/* ---------------- modal system ---------------- */
const MD=$('#modal');
function field(o){
  const id=o.id,req=o.req?' required':'',lab=`<label for="${id}">${o.label}${o.req?' <span class="req" aria-hidden="true">*</span>':''}</label>`;
  let ctl;const v=o.value==null?'':o.value;
  if(o.type==='select'){ctl=`<select id="${id}" name="${o.name}"${req} ${o.attrs||''}>${o.html||((o.blank!==false?`<option value="">${o.blank||'Select'}</option>`:'')+o.opts.map(x=>{const[val,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`}).join(''))}</select>`}
  else if(o.type==='textarea')ctl=`<textarea id="${id}" name="${o.name}"${req} ${o.attrs||''}>${esc(v)}</textarea>`;
  else ctl=`<input id="${id}" name="${o.name}" type="${o.type||'text'}" value="${esc(v)}"${req} ${o.attrs||''}>`;
  return`<div class="field ${o.full?'full':''}">${lab}${ctl}${o.help?`<p class="help">${o.help}</p>`:''}</div>`;
}
function openModal({title,body,foot,wide,onSubmit,onOpen,submitLabel='Save',submitClass=''}){
  MD.className=wide?'wide':'';
  MD.innerHTML=`<form class="mform" novalidate><header class="mhead"><h2 id="mtitle">${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ic('x')}</button></header><div class="mbody">${body}</div><footer class="mfoot">${foot||`<button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn ${submitClass}">${submitLabel}</button>`}</footer></form>`;
  MD.setAttribute('aria-labelledby','mtitle');
  const f=MD.querySelector('form');
  f.addEventListener('submit',async ev=>{
    ev.preventDefault();if(!onSubmit)return MD.close();
    if(!validate(f))return;
    const btns=f.querySelectorAll('button[type=submit]');btns.forEach(b=>b.disabled=true);
    try{const r=await onSubmit(new FormData(f),f,ev.submitter);if(r!==false)MD.close()}
    catch(e){if(!f.querySelector('.formerr'))f.querySelector('.mbody').insertAdjacentHTML('afterbegin','<div class="formerr" role="alert">This was not saved. Check your connection and try again.</div>')}
    finally{btns.forEach(b=>b.disabled=false)}
  });
  f.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>MD.close()));
  if(!MD.open)MD.showModal();
  onOpen&&onOpen(f);
  const first=f.querySelector('.mbody input,.mbody select,.mbody textarea');if(first)first.focus();
}
function whenReady(col,id,fn,n=0){if(S[col].some(x=>x.id===id))return fn();if(n<30)setTimeout(()=>whenReady(col,id,fn,n+1),100)}
function validate(f){
  f.querySelectorAll('.ferr,.formerr').forEach(e=>e.remove());f.querySelectorAll('[aria-invalid]').forEach(e=>{e.removeAttribute('aria-invalid');e.removeAttribute('aria-describedby')});
  let first=null;
  f.querySelectorAll('[required]').forEach(el=>{if(!String(el.value).trim()){const l=f.querySelector(`label[for="${el.id}"]`);setErr(el,`${l?l.textContent.replace('*','').trim():'This field'} is required.`);first=first||el}});
  if(first){first.focus();return false}return true;
}
function setErr(el,msg){el.setAttribute('aria-invalid','true');const p=document.createElement('p');p.className='ferr';p.id=el.id+'-err';p.textContent=msg;el.setAttribute('aria-describedby',p.id);(el.closest('.field')||el.parentNode).append(p);el.focus()}
function confirmBox(title,msg,label,fn){openModal({title,body:`<p style="margin:0">${msg}</p>`,submitLabel:label,submitClass:'bad',onSubmit:fn})}

/* ---------------- toasts ---------------- */
function toast(msg,o={}){
  const t=document.createElement('div');t.className='toast '+(o.kind||'');const s=document.createElement('span');s.textContent=msg;t.append(s);
  if(o.undo){const b=document.createElement('button');b.className='toast-btn';b.textContent='Undo';b.onclick=async()=>{t.remove();try{await o.undo();toast('Change undone.')}catch(e){}};t.append(b)}
  $('#toasts').append(t);setTimeout(()=>t.remove(),o.undo?7000:4000);
}

function wireStatus(f,p){
  const s=f.querySelector('#'+p+'-status');
  const upd=()=>{const v=s.value;f.querySelector('#'+p+'-sep').hidden=v!=='Separated';f.querySelector('#'+p+'-bl').hidden=v!=='Blocklisted';
    [['-sr','Separated'],['-sd','Separated'],['-br','Blocklisted'],['-bd','Blocklisted'],['-bx','Blocklisted']].forEach(([k,st])=>{const el=f.querySelector('#'+p+k);el.required=v===st;const l=f.querySelector(`label[for="${p+k}"]`);if(l){l.querySelectorAll('.req').forEach(x=>x.remove());if(v===st)l.insertAdjacentHTML('beforeend',' <span class="req" aria-hidden="true">*</span>')}})};
  s.addEventListener('change',upd);upd();
}
function applyStatus(fd,f,p,o,prev){
  const st=String(fd.get('status')||'Active');const g=k=>String(fd.get(k)||'').trim();
  if(st==='Separated'&&g('separationReason')==='Other'&&!g('separationDetails')){setErr(f.querySelector('#'+p+'-sx'),'Describe the reason for separation.');return false}
  o.status=st;
  if(st==='Separated')Object.assign(o,{separationReason:g('separationReason'),separationDate:g('separationDate'),lastWorkingDay:g('lastWorkingDay'),separationDetails:g('separationDetails'),rehireEligible:g('rehireEligible')});
  if(st==='Blocklisted')Object.assign(o,{blocklistReason:g('blocklistReason'),blocklistDate:g('blocklistDate'),blocklistDetails:g('blocklistDetails'),rehireEligible:'No'});
  const before=prev?empStatus(prev):null;
  const reason=st==='Separated'?o.separationReason:st==='Blocklisted'?o.blocklistReason:'';
  const prevReason=prev?(before==='Separated'?sepReason(prev):before==='Blocklisted'?prev.blocklistReason:''):'';
  if(before!==st||reason!==prevReason)o.statusHistory=(o.statusHistory||[]).concat([{status:st,reason,details:st==='Separated'?o.separationDetails:st==='Blocklisted'?o.blocklistDetails:'',date:st==='Separated'?o.separationDate:st==='Blocklisted'?o.blocklistDate:today(),at:new Date().toISOString(),by:MEID}]);
  return true;
}
function blocklistMatch(first,last,birth,selfId){
  const n=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  return S.employees.find(x=>x.id!==selfId&&empStatus(x)==='Blocklisted'&&n(x.firstName)===n(first)&&n(x.lastName)===n(last)&&(!x.birthDate||!birth||x.birthDate===birth));
}

/* ---- Address picker ----

   Saved as e.addr / e.permAddr = {prov,city,brgy,street}; e.address / e.permanentAddress keep the full address as one line. */
let ADDRP=null;
const loadAddr=()=>ADDRP||(ADDRP=fetch('ph-address.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{const m={};j.p.forEach(([p,cs])=>{m[p]={};cs.forEach(([c,bs])=>m[p][c]=bs)});return m}).catch(err=>{ADDRP=null;throw err}));
const brgyLabel=b=>/^(barangay|brgy\.?)\s/i.test(b)?b:'Brgy. '+b;
const addrLine=a=>a?[a.street,a.brgy&&brgyLabel(a.brgy),a.city,a.prov].map(x=>String(x||'').trim()).filter(Boolean).join(', '):'';
/* Best guess of {prov,city,brgy,street} from a one-line address, e.g. "123 Rizal St., Brgy. San Roque, Antipolo City, Rizal". */
function guessAddr(M,text){
  const full=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s*\(.*?\)\s*/g,' ').replace(/^(brgy\.?|barangay)\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();
  const base=s=>full(s).replace(/^city of\s+|\s+city$/g,'').trim();
  const segs=String(text||'').split(',').map(s=>s.trim()).filter(Boolean),F=segs.map(full),B=segs.map(base);
  let pi=-1,provs=Object.keys(M).filter(p=>{const i=F.findIndex(x=>x===full(p)||(p==='Metro Manila'&&/^(metro manila|ncr)$/.test(x)));if(i>=0)pi=i;return i>=0});
  if(provs.length!==1){provs=[];pi=-1}
  const pool=provs.length?provs:Object.keys(M),cityAt=c=>{let i=F.findIndex((x,k)=>k!==pi&&x===full(c));if(i<0)i=B.findIndex((x,k)=>k!==pi&&x===base(c));return i};
  const cands=[];pool.forEach(p=>Object.keys(M[p]).forEach(c=>{const i=cityAt(c);if(i>=0)cands.push([p,c,i])}));
  const exact=cands.filter(x=>F[x[2]]===full(x[1]));const hit=cands.length===1?cands[0]:exact.length===1?exact[0]:null;
  if(!hit)return provs.length?{prov:provs[0],city:'',brgy:'',street:segs.filter((s,i)=>i!==pi).join(', ')}:null;
  const[p,c,ci]=hit;const bi=M[p][c].map(b=>F.findIndex((x,k)=>k!==pi&&k!==ci&&x===full(b)));const bk=bi.findIndex(i=>i>=0);
  const drop=new Set([pi,ci,bk>=0?bi[bk]:-1]);
  return{prov:p,city:c,brgy:bk>=0?M[p][c][bk]:'',street:segs.filter((s,i)=>!drop.has(i)).join(', ')};
}
function addrBlock(k,label,a,old){
  a=a||{};const sel=(n,ph)=>`<select name="${k}_${n}" aria-label="${label}: ${ph}" disabled><option value="">${ph}</option></select>`;
  return`<div class="field full addr" data-addr="${k}" data-prov="${esc(a.prov||'')}" data-city="${esc(a.city||'')}" data-brgy="${esc(a.brgy||'')}"><span class="addr-lbl" id="${k}-lbl">${label}</span>
    <div class="addr-g" role="group" aria-labelledby="${k}-lbl">${sel('prov','Province')}${sel('city','City / Municipality')}${sel('brgy','Barangay')}
    <input name="${k}_street" value="${esc(a.street!=null?a.street:(old||''))}" placeholder="House no., street, subdivision / village" aria-label="${label}: house no., street, subdivision"></div>
    <p class="help addr-msg">${!a.prov&&old?'Saved as typed before. Choose the province, city and barangay, then keep only the house no. and street in the last box.':''}</p></div>`;
}
function wireAddr(f,k,onChange){
  const box=f.querySelector(`[data-addr="${k}"]`);if(!box)return{};
  const P=box.querySelector(`[name="${k}_prov"]`),C=box.querySelector(`[name="${k}_city"]`),B=box.querySelector(`[name="${k}_brgy"]`),St=box.querySelector(`[name="${k}_street"]`);
  let M=null,locked=false;
  const opts=(el,ph,list,v)=>{el.innerHTML=`<option value="">${ph}</option>`+list.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');el.disabled=locked||!list.length};
  const fill=(p,c,b)=>{if(!M)return;opts(P,'Province',Object.keys(M),p);const cs=p&&M[p]?Object.keys(M[p]):[];opts(C,'City / Municipality',cs,c);opts(B,'Barangay',c&&cs.includes(c)?M[p][c]:[],b)};
  P.addEventListener('change',()=>{fill(P.value,'','');onChange&&onChange()});
  C.addEventListener('change',()=>{fill(P.value,C.value,'');onChange&&onChange()});
  B.addEventListener('change',()=>onChange&&onChange());St.addEventListener('input',()=>onChange&&onChange());
  loadAddr().then(m=>{M=m;
    if(!box.dataset.prov&&St.value.trim()){const g=guessAddr(M,St.value);if(g){Object.assign(box.dataset,{prov:g.prov,city:g.city,brgy:g.brgy});St.value=g.street;
      box.querySelector('.addr-msg').textContent=`Filled in from the address typed before${g.brgy?'':g.city?'. Choose the barangay':'. Choose the city and barangay'}. Please check before saving.`}}
    fill(box.dataset.prov,box.dataset.city,box.dataset.brgy);onChange&&onChange()},()=>{box.querySelector('.addr-msg').textContent='The province and barangay list could not load. Type the full address in the box for now.'});
  const api={get:()=>({prov:P.value,city:C.value,brgy:B.value,street:St.value.trim()}),
    set:a=>{St.value=a.street||'';if(M)fill(a.prov,a.city,a.brgy);else Object.assign(box.dataset,{prov:a.prov||'',city:a.city||'',brgy:a.brgy||''})},
    lock:on=>{locked=on;St.readOnly=on;[P,C,B].forEach(x=>x.disabled=on||x.options.length<2)},
    el:{P,C,B,St}};
  return api;
}

/* ---- Service Incentive Leave credits ----
   From the 1st anniversary of the hire date: on every anniversary the 5 SIL are received in salary and a new
   service year starts. Credits for the current service year accrue at 5/12 per completed month since the last
   anniversary (e.g. anniversary Feb 12, as of Oct 9 = 7 months = 2.9167). Only Sick and Vacation leave, combined,
   use the credits, and only once HR approves the leave. */
const SIL_DAYS=5;
const SIL_TYPES=['Vacation','Sick','Service Incentive'];
const r4=v=>Math.round(v*10000)/10000;
const f4=v=>r4(v).toFixed(4);
const usesCredits=l=>SIL_TYPES.includes(l.type);
const creditUsed=l=>l.creditDays!=null?l.creditDays:(l.days||0);
function silInfo(e,asOf){
  asOf=asOf||today();if(!e||!e.hireDate)return null;
  const first=addMonths(e.hireDate,12);
  if(asOf<first)return{eligible:false,firstAnniv:first};
  let k=1;while(addMonths(e.hireDate,12*(k+1))<=asOf)k++;
  const anniv=addMonths(e.hireDate,12*k),next=addMonths(e.hireDate,12*(k+1)),prev=addMonths(e.hireDate,12*(k-1));
  let months=0;while(months<12&&addMonths(anniv,months+1)<=asOf)months++;
  const mine=S.leaves.filter(l=>l.employeeId===e.id&&usesCredits(l));
  const inRange=(l,a,b)=>l.from>=a&&l.from<b;
  const used=r4(mine.filter(l=>l.status==='Approved'&&inRange(l,anniv,next)).reduce((s,l)=>s+creditUsed(l),0));
  const pending=mine.filter(l=>l.status==='Pending'&&inRange(l,anniv,next)).reduce((s,l)=>s+(l.days||0),0);
  const usedPrev=k>1?mine.filter(l=>l.status==='Approved'&&inRange(l,prev,anniv)).reduce((s,l)=>s+creditUsed(l),0):0;
  const earned=r4(SIL_DAYS/12*months);
  return{eligible:true,anniv,next,months,earned,used,pending,available:r4(earned-used),
    paid:{date:anniv,days:k===1?SIL_DAYS:r4(Math.max(0,SIL_DAYS-usedPrev)),first:k===1},nextMonth:months<12?addMonths(anniv,months+1):null};
}
function silCard(e){
  const s=silInfo(e);
  if(!s)return`<section class="sect"><h4>Leave credits (SIL)</h4><p class="help" style="margin:0;color:var(--muted)">Add a hire date to compute leave credits.</p></section>`;
  if(!s.eligible)return`<section class="sect"><h4>Leave credits (SIL)</h4><div class="silbox"><div class="silnum"><b class="num">0.0000</b><span>available</span></div><p class="help" style="margin:0">Not yet eligible. ${esc(e.firstName)} receives 5 Service Incentive Leaves on the first anniversary, <b>${fmt(s.firstAnniv)}</b>. Sick and vacation leave before then is without pay.</p></div></section>`;
  return`<section class="sect"><h4>Leave credits (SIL) · Sick + Vacation combined</h4><div class="silbox">
    <div class="silnum ${s.available<0?'neg':''}"><b class="num">${f4(s.available)}</b><span>available</span></div>
    <dl class="silcalc">
      <div><dt>Service year</dt><dd>${fmt(s.anniv)} – ${fmt(addDays(s.next,-1))}</dd></div>
      <div><dt>Earned so far</dt><dd class="num">5 ÷ 12 × ${s.months} month${s.months===1?'':'s'} = <b>${f4(s.earned)}</b></dd></div>
      <div><dt>Used (approved)</dt><dd class="num">− ${f4(s.used)}</dd></div>
      <div><dt>Pending approval</dt><dd class="num">${s.pending?`${s.pending} day${s.pending===1?'':'s'} (not yet deducted)`:'None'}</dd></div>
      <div><dt>Next credit</dt><dd>${s.nextMonth?`+${f4(SIL_DAYS/12)} on ${fmt(s.nextMonth)}`:'—'}</dd></div>
      <div><dt>On ${fmt(s.anniv)}</dt><dd>${s.paid.first?`First anniversary: 5 SIL received in salary`:`${f4(s.paid.days)} unused SIL from the previous year received in salary`}</dd></div>
    </dl></div></section>`;
}
function creditPanel(l){
  if(!usesCredits(l))return`<p class="help" style="margin:0;color:var(--muted)">${esc(l.type)} leave does not use SIL credits. Only Sick and Vacation leave do.</p>`;
  const e=EMP[l.employeeId];const s=silInfo(e);if(!s)return'';
  if(l.status==='Approved')return`<div class="silline">${ic('check')}<span>Deducted <b>${f4(l.creditDays!=null?l.creditDays:l.days)}</b> from SIL credits${l.unpaidDays?` · <b>${l.unpaidDays}</b> day${l.unpaidDays===1?'':'s'} without pay`:''}.</span></div>`;
  if(l.status!=='Pending')return'';
  const avail=s.eligible?Math.max(0,s.available):0;const fromCredits=r4(Math.min(l.days,avail));const unpaid=r4(l.days-fromCredits);
  return`<div class="silline ${unpaid>0?'warn':''}">${ic(unpaid>0?'alert':'info')}<span>${s.eligible?`Available SIL credits: <b>${f4(s.available)}</b>. `:`Not yet eligible for SIL (first anniversary ${fmt(s.firstAnniv)}). `}If approved: <b>${f4(fromCredits)}</b> deducted from credits${unpaid>0?`, <b>${f4(unpaid)}</b> day${unpaid===1?'':'s'} without pay`:''}${s.eligible?`, leaving <b>${f4(Math.max(0,s.available)-fromCredits)}</b>`:''}.</span></div>`;
}

      const drawType=()=>{const t=f.type.value;dw.hidden=t!=='Notice to Explain';const hol=t==='Holiday Work Arrangement',nw=t==='No Work Arrangement';evf.hidden=!(hol||nw);

      f.addEventListener('input',pv);f.addEventListener('change',pv);
      drawTo();drawType();if((m.type==='Holiday Work Arrangement'||m.type==='No Work Arrangement')&&!m.body)fill();pv();
    },
    onSubmit:async(fd,f,sub)=>{

      const o=id?clone(m):{id:uid(),no:''};

      o.scope='external';o.toType=isOrg?'org':r;o.orgKind=isOrg?r.slice(4):'';o.toValue=r==='client'||r==='employee'?String(fd.get('toValue')||''):'';
      ['toName','toPosition','toCompany','toAddress','greeting'].forEach(k=>o[k]=isOrg?String(fd.get(k)||'').trim():'');
      o.from=[o.fromName,o.fromTitle].filter(Boolean).join(', ');
      o.responseDue=o.type==='Notice to Explain'?String(fd.get('responseDue')||''):'';
      if(o.type==='Notice to Explain'&&o.responseDue&&diff(o.issuedOn,o.responseDue)<5){setErr(f.querySelector('#xm-due'),'Give the employee at least 5 calendar days to explain.');return false}
      o.event=o.type==='Holiday Work Arrangement'||o.type==='No Work Arrangement'?{name:String(fd.get('evName')||'').trim(),date:String(fd.get('evDate')||''),kind:String(fd.get('evKind')||''),resume:String(fd.get('evResume')||'')}:null;
      const issued=isOrg?'Sent':'Open';
      if(send){if(!o.status||o.status==='Draft'){o.status=issued;o.sentAt=new Date().toISOString();o.sentBy=MEID}}else o.status='Draft';
      assignNo(o,m);await save('memos',o);toast(send?`${o.no} issued to ${memoTo(o)}.`:`${o.no} saved as a draft.`);
    }});
}

/* ---------------- 201 document uploads ---------------- */
function fileType(f){const t=(f.type||'').toLowerCase();if(Object.values(FILE_TYPES).includes(t))return t;const ext=(f.name.split('.').pop()||'').toLowerCase();return FILE_TYPES[ext]||null}
function upErr(e){const c=e&&e.code;return c==='too_large'?'larger than 20 MB':c==='unsupported_type'?'use PDF, JPG or PNG':c==='quota_or_state'?'document storage is full':c==='rate_limited'?'too many uploads at once, try again in a minute':c==='not_granted'||c==='capability_disabled'?'you do not have upload access':'upload failed, try again'}
async function uploadFiles(empId,k,files){
  if(!ASSETS)return toast('Uploads are not available here.',{kind:'bad'});
  const label=(DOCS.find(d=>d[0]===k)||[k,k])[1];const key=empId+':'+k;const ok=[],errs=[];
  UPL[key]=true;renderDrawer();
  for(const file of files){
    const type=fileType(file);
    if(!type){errs.push(`${file.name}: use PDF, JPG or PNG (save phone photos as JPG)`);continue}
    if(file.size>20*1048576){errs.push(`${file.name}: larger than 20 MB, compress it first`);continue}
    try{const r=await ASSETS.upload(file,{type});ok.push({id:r.id,name:file.name.slice(0,140),type:r.contentType,size:r.sizeBytes,at:new Date().toISOString(),by:MEID})}
    catch(err){if(err&&err.code==='store_unavailable'){try{await new Promise(r=>setTimeout(r,1200));const r=await ASSETS.upload(file,{type});ok.push({id:r.id,name:file.name.slice(0,140),type:r.contentType,size:r.sizeBytes,at:new Date().toISOString(),by:MEID});continue}catch(e2){err=e2}}errs.push(`${file.name}: ${upErr(err)}`)}
  }
  delete UPL[key];
  if(ok.length&&EMP[empId]){
    const o=clone(EMP[empId]);o.files=o.files||{};o.files[k]=(o.files[k]||[]).concat(ok);o.docs=o.docs||{};o.docs[k]=true;
    try{await save('employees',o);toast(`${ok.length} file${ok.length===1?'':'s'} added to ${label}.`)}catch(err){for(const f of ok){try{await ASSETS.delete(f.id)}catch(e3){}}}
  }
  renderDrawer();
  if(errs.length)toast(errs.join(' · '),{kind:'bad'});
}
function findFile(empId,ref){const[k,fid]=ref.split('|');const e=EMP[empId];const f=e&&docFiles(e,k).find(x=>x.id===fid);return{e,k,fid,f}}
function viewFile(empId,ref){
  const{e,k,f}=findFile(empId,ref);if(!f)return;const label=(DOCS.find(d=>d[0]===k)||[k,k])[1];const url='/_blob/'+f.id;
  openModal({title:esc(label),wide:1,
    body:`<dl class="summary"><dt>Employee</dt><dd>${esc(fullName(e))}</dd><dt>File</dt><dd>${esc(f.name)}</dd><dt>Uploaded</dt><dd>${fmtTs(f.at)} by ${uname(f.by)} · ${fsize(f.size||0)}</dd></dl>
      ${/^image\//.test(f.type)?`<img src="${esc(url)}" alt="${esc(label)} of ${esc(fullName(e))}" style="width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)">`
      :`<div class="empty" style="border:1px dashed var(--line);border-radius:12px">${ic('pdf')}<strong>PDF document</strong>Open it in a new tab to view or download it.</div>`}`,
    foot:`<button type="button" class="btn ghost left" data-close>Close</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${ic('ext')}Open in new tab</a>`});
  resolveNames();
}
function delFile(empId,ref){
  const{e,k,fid,f}=findFile(empId,ref);if(!f)return;const label=(DOCS.find(d=>d[0]===k)||[k,k])[1];
  confirmBox('Remove this document?',`This permanently deletes <b>${esc(f.name)}</b> from the ${esc(label)} requirement of ${esc(fullName(e))}.`,'Remove document',async()=>{
    const o=clone(EMP[empId]);o.files[k]=(o.files[k]||[]).filter(x=>x.id!==fid);if(!o.files[k].length)delete o.files[k];
    await save('employees',o);try{await ASSETS.delete(fid)}catch(err){}toast('Document removed.');
  });
}

const appDate=a=>((a.jotform&&a.jotform.createdAt)||'').slice(0,10)||(a.form&&a.form.dateApplied)||'';
const appBl=a=>{const f=a.form||{};return blocklistMatch(f.firstName,f.lastName,f.birthDate)};

  if(q)list=list.filter(a=>{const x=a.form||{};return[appName(a),x.position,x.mobile,x.email,x.presentAddress,a.notes].join(' ').toLowerCase().includes(q)});

    <section class="sect"><h4>Character references</h4>${tbl([['Name','name'],['Occupation','occupation'],['Contact no.','phone'],['Address','address']],x.references)}</section>`,
    foot:`<button type="button" class="btn ghost left" data-close>Close</button>${hired?'':`<button type="button" class="btn ghost" data-write id="ap-hire">${ic('plus')}Hire · create 201 file</button>`}<button type="submit" class="btn" data-write>Save</button>`,
    onSubmit:async fd=>{
      const o=clone(a);const st=String(fd.get('status'));
      if(st!==appStatus(a))o.statusHistory=(o.statusHistory||[]).concat({from:appStatus(a),to:st,at:new Date().toISOString(),by:MEID});
      o.status=st;o.notes=String(fd.get('notes')||'').trim();await save('applicants',o);toast(`${appName(a)} · ${st}.`);
    },
    onOpen:f=>{const b=f.querySelector('#ap-hire');if(b)b.onclick=()=>{if(bl&&!confirm('This applicant matches a blocklisted person. Continue anyway?'))return;MD.close();hireApplicant(id)}}});
}

/* Pre-fills a new 201 file from the application. HR completes deployment details, then saves. */
function hireApplicant(id){
  const a=S.applicants.find(x=>x.id===id);if(!a)return;const x=a.form||{};const em=x.emergency||{};
  const cs=titleCase(x.civilStatus),sx=titleCase(x.gender),ed=x.education||{};
  const top=[ed.tertiary,ed.vocational,ed.secondary,ed.primary].find(s=>s&&s.school)||{};
  empForm(null,{applicantId:a.id,firstName:x.firstName,middleName:x.middleName,lastName:x.lastName,suffix:x.suffix,
    gender:['Male','Female'].includes(sx)?sx:'',civilStatus:['Single','Married','Widowed','Separated'].includes(cs)?cs:'',
    birthDate:x.birthDate,birthPlace:x.birthPlace,nationality:x.citizenship||'Filipino',religion:x.religion,mobile:x.mobile,email:x.email,
    address:x.presentAddress,position:titleCase(x.position),dependents:x.childrenCount,
    school:top.school||'',course:[top.course,top.major].filter(Boolean).join(' · '),
    sss:x.sss,philhealth:x.philhealth,pagibig:x.pagibig,tin:x.tin,
    emergencyName:em.name,emergencyPhone:em.phone,emergencyRelation:em.relationship});
}
async function markHired(appId,empId){
  const a=S.applicants.find(x=>x.id===appId);if(!a)return;const o=clone(a);
  if(appStatus(a)!=='Hired')o.statusHistory=(o.statusHistory||[]).concat({from:appStatus(a),to:'Hired',at:new Date().toISOString(),by:MEID});
  o.status='Hired';o.hiredEmployeeId=empId;try{await save('applicants',o)}catch(e){}
}
async function syncJotform(el){
  if(!window.HRIS_SB)return;el.disabled=true;const t=el.innerHTML;el.textContent='Checking Jotform…';
  try{const{data,error}=await window.HRIS_SB.functions.invoke('jotform-sync',{body:{}});if(error)throw error;
    toast(data&&data.written?`${data.written} application${data.written===1?'':'s'} added or updated.`:'No new applications.')}
  catch(e){toast('Could not reach Jotform. Try again in a minute.',{kind:'bad'})}
  finally{el.disabled=false;el.innerHTML=t}
}

  grp:()=>{groupOpen=!groupOpen;renderNav()},
  tab:(el,id,k)=>{UI[id].tab=k;renderView()},
  dtab:(el,id)=>{drawerTab=id;renderDrawer();DR.querySelector(`[data-act="dtab"][data-id="${id}"]`).focus()},
  'add-emp':()=>empForm(),
  'edit-emp':(el,id)=>empForm(id),
  'open-emp':(el,id,k)=>openEmp(id,k),
  'file-leave':(el,id)=>{if(!S.employees.some(isActive))return toast('Add an active employee first.',{kind:'bad'});leaveForm(id)},
  'req-permit':(el,id)=>permitForm(id),
  'issue-memo':(el,id,k)=>{if(id&&!isOffice(EMP[id]))return xmemoForm(null,k,id);memoForm(null,k,id)},

  'view-permit':(el,id)=>viewPermit(id),

  regularize:(el,id)=>regularizeForm(id),
  del:(el,id,k)=>{const r=S[k].find(x=>x.id===id);const n=((r&&r.attachments)||[]).length;confirmBox('Delete this record?',`This permanently deletes the leave record${n?` and its ${n} attachment${n===1?'':'s'}`:''}.`,'Delete',async()=>{await remove(k,id);if(ASSETS&&r)for(const f of r.attachments||[]){try{await ASSETS.delete(f.id)}catch(e){}}toast('Record deleted.')})},
  'clear-sample':clearSample,
  'client-filter':(el,id)=>{UI.emp.client=id==='Unassigned'?'':id;UI.emp.tab='Active';go('employees')},
  upload:(el,id,k)=>{const i=DR.querySelector('#up-'+k);if(i)i.click()},

  'toggle-acct':(el,id)=>{SHOWACCT[id]=!SHOWACCT[id];renderDrawer()},
  'issue-xmemo':(el,id,k)=>xmemoForm(null,k,id),
  'att-edit':(el,id,k)=>attEdit(id,k),
  'export-201':()=>export201(),
  'att-import':()=>attImport(),
  'pol-save':()=>polSave(),
  'pol-discard':()=>{UI.pol=null;renderView()},
  'att-copy':()=>attCopy(),
  'eop-notice':(el,id)=>{const e=EMP[id];const n=e&&eopNotice(e);if(n)viewMemo(n.id);else eopForm(id)},
  'set-eoc':(el,id)=>{const e=EMP[id];const n=eopNotice(e);confirmBox('Set as Separated?',`This changes ${esc(fullName(e))}'s status to <b>Separated</b>, reason <b>End of Probationary Employment</b>${n&&n.effectiveOn?`, effective ${fmt(n.effectiveOn)} as stated in ${esc(n.no)}`:''}. The 201 file is kept.`,'Set as Separated',async()=>{const prev=clone(e);const o=clone(e);const d=(n&&n.effectiveOn)||today();Object.assign(o,{status:'Separated',separationReason:'End of Probationary Employment',separationDate:d,separationDetails:n?`Per ${n.no}.`:'',rehireEligible:o.rehireEligible||''});o.statusHistory=(o.statusHistory||[]).concat([{status:'Separated',reason:'End of Probationary Employment',details:o.separationDetails,date:d,at:new Date().toISOString(),by:MEID}]);await save('employees',o);toast(`${fullName(e)} is now Separated.`,{undo:()=>save('employees',prev)})})},
  'change-status':(el,id)=>statusForm(id),
  'reg-notice':(el,id)=>{const e=EMP[id];const n=e&&regNotice(e);if(n)viewMemo(n.id);else noticeForm(id)},
  'view-att':(el,id,k)=>viewAtt(id,k),
  'del-file':(el,id,k)=>delFile(id,k),
  'view-app':(el,id)=>viewApplicant(id),
  'app-sync':el=>syncJotform(el)
};
document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-act]');if(!a)return;
  if(a.tagName==='TR'&&ev.target.closest('button,a,input,select'))return;
  const f=ACT[a.dataset.act];if(f){ev.stopPropagation();f(a,a.dataset.id,a.dataset.k,ev)}
});
document.addEventListener('keydown',ev=>{
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-act]')){ev.preventDefault();ev.target.click()}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();openSearch()}
});
let ft=null;
document.addEventListener('input',ev=>{if(ev.target.dataset&&ev.target.dataset.pol)return polInput(ev.target);const k=ev.target.dataset&&ev.target.dataset.filter;if(!k)return;const[a,b]=k.split('.');UI[a][b]=ev.target.value;clearTimeout(ft);ft=setTimeout(renderView,ev.target.tagName==='INPUT'?140:0)});

/* ---------------- global search ---------------- */
const GQ=$('#gq'),GR=$('#gres'),GS=$('#gsearch');
function openSearch(){GS.classList.add('open');GQ.focus()}
function drawSearch(){
  const q=GQ.value.trim().toLowerCase();if(!q){GR.hidden=true;GQ.setAttribute('aria-expanded','false');return}
  const hits=S.employees.filter(e=>[fullName(e),e.empNo,e.position,e.department,e.client].join(' ').toLowerCase().includes(q)).sort(sortName).slice(0,7);
  GR.innerHTML=hits.length?hits.map(e=>`<button data-gid="${e.id}"><span class="avatar" style="width:34px;height:34px;font-size:12.5px" aria-hidden="true">${esc(initials(e))}</span><span style="min-width:0"><b>${esc(fullName(e))}</b><br><span style="color:var(--muted);font-size:13.5px">${esc(e.empNo)} · ${esc(e.position)}${e.client?' · '+esc(e.client):''}</span></span></button>`).join(''):`<div class="none">No employee matches “${esc(GQ.value)}”.</div>`;
  GR.hidden=false;GQ.setAttribute('aria-expanded','true');
}
GQ.addEventListener('input',drawSearch);
GQ.addEventListener('focus',()=>{GS.classList.add('open');drawSearch()});
GQ.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const b=GR.querySelector('[data-gid]');if(b)b.click()}if(ev.key==='Escape'){GQ.value='';GR.hidden=true;GQ.blur()}if(ev.key==='ArrowDown'){const b=GR.querySelector('button');if(b){ev.preventDefault();b.focus()}}});
GR.addEventListener('keydown',ev=>{const bs=[...GR.querySelectorAll('button')];const i=bs.indexOf(document.activeElement);if(ev.key==='ArrowDown'&&bs[i+1]){ev.preventDefault();bs[i+1].focus()}if(ev.key==='ArrowUp'){ev.preventDefault();(bs[i-1]||GQ).focus()}if(ev.key==='Escape')GQ.focus()});
GR.addEventListener('click',ev=>{const b=ev.target.closest('[data-gid]');if(!b)return;GR.hidden=true;GQ.value='';GS.classList.remove('open');openEmp(b.dataset.gid)});
document.addEventListener('click',ev=>{if(!GS.contains(ev.target)){GR.hidden=true;GS.classList.remove('open');GQ.setAttribute('aria-expanded','false')}});

/* ---------------- boot ---------------- */
async function init(){
  render(false);
  let db=null,user=null,assets=null;
  try{if(window.claude&&typeof window.claude.use==='function'){[db,user,assets]=await Promise.all([window.claude.use('db').catch(()=>null),window.claude.use('user').catch(()=>null),window.claude.use('assets').catch(()=>null)])}}catch(e){}
  USER=user;ASSETS=db?assets:null;
  if(user){
    try{const me=await user.me();MEID=me.id;const av=$('#me');if(me.name){av.title=me.name;av.textContent=me.name.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase()}}catch(e){}
    try{if(await user.can('data.write')===false)document.body.classList.add('ro')}catch(e){}
  }
  if(db){
    DB=db;MODE='db';const got=new Set();
    $('#syncdot').classList.add('live');$('#synctext').textContent='Records are saved and shared with your HR team.';
    db.doc('config/attendance').onSnapshot(s=>{const d=s.exists?s.data():null;ATTSET={...ATT_DEF,...(d||{})};if(MODE==='db')refresh()},()=>{});
    db.doc('config/app').onSnapshot(s=>{const was=DEMO;DEMO=!!(s.exists&&s.data()&&s.data().demo);const bar=$('#demobar');bar.hidden=!DEMO;
      if(DEMO)bar.innerHTML=`${ic('info')}<span><b>Demo system.</b> Every employee, client record, ID, bank number and document here is fictional sample data for review only.${document.body.classList.contains('ro')?' You are viewing it read-only.':''}</span>`;
      if(was!==DEMO&&MODE==='db')refresh()},()=>{});
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.add(c);if(got.size===COLS.length)refresh()},()=>{toast('Live updates stopped. Reload the page to reconnect.',{kind:'bad'})}));
  }else{
    MODE='local';
    try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);COLS.forEach(c=>S[c]=Array.isArray(o[c])?o[c]:[]);if(o.attset)ATTSET={...ATT_DEF,...o.attset}}}catch(e){}
    $('#synctext').textContent='Offline mode: records are saved in this browser only.';
    refresh();
  }
}
init();
})();
